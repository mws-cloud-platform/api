    PostgresExtensionSpecResponse:
      type: object
      description: Спецификация расширения
      properties:
        name:
          type: string
          description: Имя расширения
      required:
        - name

    PostgresClusterDatabaseStatusResponse:
      $ref: '#/components/schemas/ResourceStatusResponse'

    PostgresClusterDatabaseRequest:
      type: object
      description: База данных в Managed PostgreSQL — это логически изолированный набор данных внутри кластера PostgreSQL
      properties:
        metadata:
          $ref: '#/components/schemas/TypedResourceMetadataRequest'
        spec:
          $ref: '#/components/schemas/PostgresClusterDatabaseSpecRequest'
          description: Обязательно для заполнения при создании ресурса

    PostgresClusterDatabaseSpecRequest:
      type: object
      properties:
        owner:
          type: string
          description: |-
            Имя владельца
          
            Строка в форматах:
              Полный формат:
                - "mpostgres/projects/{project}/clusters/{cluster}/users/{user}"
              Сокращенные форматы:
                - "projects/{project}/clusters/{cluster}/users/{user}"
                - "clusters/{cluster}/users/{user}"
                - "users/{user}"
                - "{user}"
          
            Полный формат всегда корректен.
            Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
          
            Обязательно для заполнения при создании ресурса
          
            Примеры:
              - "mpostgres/projects/myProject/clusters/myCluster/users/myUser"
              - "projects/myProject/clusters/myCluster/users/myUser"
              - "clusters/myCluster/users/myUser"
              - "users/myUser"
              - "myUser"
        lcCollate:
          type: string
          description: |-
            Порядок сортировки строк
          
            Неизменяемое поле. Задается только при создании ресурса.
            При обновлении ресурса можно передать только текущее значение
        lcCtype:
          type: string
          description: |-
            Классификация символов
          
            Неизменяемое поле. Задается только при создании ресурса.
            При обновлении ресурса можно передать только текущее значение
        template:
          type: string
          description: |-
            Шаблон для создания базы данных
          
            Строка в форматах:
              Полный формат:
                - "mpostgres/projects/{project}/clusters/{cluster}/databases/{database}"
              Сокращенные форматы:
                - "projects/{project}/clusters/{cluster}/databases/{database}"
                - "clusters/{cluster}/databases/{database}"
                - "databases/{database}"
                - "{database}"
          
            Полный формат всегда корректен.
            Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
          
            Неизменяемое поле. Задается только при создании ресурса.
            При обновлении ресурса можно передать только текущее значение
          
            Примеры:
              - "mpostgres/projects/myProject/clusters/myCluster/databases/myDatabase"
              - "projects/myProject/clusters/myCluster/databases/myDatabase"
              - "clusters/myCluster/databases/myDatabase"
              - "databases/myDatabase"
              - "myDatabase"
        deletionProtection:
          type: boolean
          description: Защита от удаления
        extensions:
          type: array
          description: |-
            Список расширений
          
            Простая коллекция. При обновлении ресурса простая коллекция, переданная в запросе, полностью заменяет существующую. Подробнее см. в описании метода `Upsert`
          items:
            $ref: '#/components/schemas/PostgresExtensionSpecRequest'

    PostgresExtensionSpecRequest:
      type: object
      description: Спецификация расширения
      properties:
        name:
          type: string
          description: |-
            Имя расширения
          
            Обязательно для заполнения при создании ресурса

    PostgresBackupPageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PostgresBackupResponse'
        nextPageToken:
          $ref: '#/components/schemas/NextPageToken'
          description: Строка, которую нужно передать в следующем запросе, чтобы получить следующую страницу. Для последней страницы не задан
      required:
        - items

    PostgresBackupResponse:
      type: object
      description: Резервное копирование в Managed PostgreSQL позволяет автоматизировать создание резервных копий кластера и его восстановление. С помощью резервных копий можно восстановить кластер в случае повреждения, потери данных или совершения ошибочных операций
      properties:
        kind:
          type: string
          default: mpostgres/v1/backups
        metadata:
          type: object
          allOf:
            - $ref: '#/components/schemas/TypedResourceMetadataResponse'
            - type: object
              properties:
                id:
                  type: string
                  description: |-
                    Ссылка на типизированный референс
                  
                    Строка в формате: "mpostgres/projects/{project}/clusters/{cluster}/backups/{backup}"
                  
                    Пример: "mpostgres/projects/myProject/clusters/myCluster/backups/myBackup"
          nullable: true
        spec:
          allOf:
            - $ref: '#/components/schemas/PostgresBackupSpecResponse'
          nullable: true
        status:
          allOf:
            - $ref: '#/components/schemas/PostgresBackupStatusResponse'
          nullable: true

    PostgresBackupSpecResponse:
      type: object

    PostgresBackupStatusResponse:
      type: object
      allOf:
        - $ref: '#/components/schemas/ResourceStatusResponse'
        - type: object
          properties:
            startTime:
              type: string
              format: date-time
            finishTime:
              type: string
              format: date-time
            uncompressedSize:
              type: string
              description: |-
                Размер в байтах. Формат: <число> [единица измерения].
                Допустимые единицы измерения: `B`, `KB`, `MB`, `GB`, `TB`, `PB`, `EB`, `ZB`, `YB`, `RB`, `QB`. По умолчанию: `B`.
                Допустимые значения — положительные целые числа и дробные числа с ненулевой целой частью.
                Значение базовой единицы измерения (в байтах) должно оставаться целым.
                Регистр и лишние пробелы перед строкой, после строки и между ее частями игнорируются
              
                Примеры:
                  - "1"
                  - "1 B"
                  - "1024 kb"
                  - "1.5 TB"
            compressedSize:
              type: string
              description: |-
                Размер в байтах. Формат: <число> [единица измерения].
                Допустимые единицы измерения: `B`, `KB`, `MB`, `GB`, `TB`, `PB`, `EB`, `ZB`, `YB`, `RB`, `QB`. По умолчанию: `B`.
                Допустимые значения — положительные целые числа и дробные числа с ненулевой целой частью.
                Значение базовой единицы измерения (в байтах) должно оставаться целым.
                Регистр и лишние пробелы перед строкой, после строки и между ее частями игнорируются
              
                Примеры:
                  - "1"
                  - "1 B"
                  - "1024 kb"
                  - "1.5 TB"
            backupTrigger:
              $ref: '#/components/schemas/BackupTrigger'

    BackupTrigger:
      type: string
      enum:
        - "AUTOMATIC"
        - "USER"

    PostgresBackupRequest:
      type: object
      description: Резервное копирование в Managed PostgreSQL позволяет автоматизировать создание резервных копий кластера и его восстановление. С помощью резервных копий можно восстановить кластер в случае повреждения, потери данных или совершения ошибочных операций
      properties:
        metadata:
          $ref: '#/components/schemas/TypedResourceMetadataRequest'
        spec:
          allOf:
            - $ref: '#/components/schemas/PostgresBackupSpecRequest'
          nullable: true

    PostgresBackupSpecRequest:
      type: object

    ApiError:
      type: object
      description: Описание ошибки (если HTTP-статус отличен от 2xx)
      properties:
        code:
          type: string
          description: Короткий код ошибки
          enum:
            - "ALREADY_EXISTS"
            - "CANCELLED"
            - "DEADLINE_EXCEEDED"
            - "FAILED_PRECONDITION"
            - "INTERNAL"
            - "INVALID_ARGUMENT"
            - "NOT_FOUND"
            - "PERMISSION_DENIED"
            - "QUOTA_EXCEEDED"
            - "IDEMPOTENCY_KEY_ALREADY_USED"
            - "INVALID_ETAG_KEY"
            - "UNAUTHENTICATED"
            - "UNAVAILABLE"
            - "METHOD_NOT_ALLOWED"
            - "TOO_MANY_REQUESTS"
        type:
          type: string
          description: Подтип расширенной информации по ошибкам к которому удалось его привести. Null если привели к базовому типу
        description:
          type: string
          description: Развёрнутое пояснение ошибки
        retryPolicy:
          allOf:
            - $ref: '#/components/schemas/RetryPolicy'
          description: Правила выполнения повторных попыток в случае ошибки
          nullable: true
        details:
          type: object
          description: |-
            Детальная информация по ошибке в произвольном JSON формате. Содержимое не предназначено для машинной обработки
          
            Примеры:
              - '{"jsonPaths": [{"path": "foo.bar", "reason": "some reason", "offset": "line: 1, column: 2"}]}'
              - '{"errorInfo": "some error info"}'
          additionalProperties: true
      required:
        - code

    RetryPolicy:
      type: object
      description: Правила выполнения повторных попыток в случае ошибки
      properties:
        retryCount:
          type: integer
          description: Максимальное количество повторных попыток. 0 - значение по-умолчанию
        retryTimeout:
          type: string
          description: |-
            Пауза между повторными попытками
          
            Поддерживаются следующие форматы:
              - ISO 8601: P(n)DT(n)H(n)M(n)S. Допустимые единицы измерения: дни (`D`), часы (`H`), минуты (`M`), секунды (`S`). Только секунды могут быть дробными
              - Простой формат. Допустимые единицы измерения: `d`, `h`, `m`, `s`, `ms`, `us`, `ns`.
                Величины должны следовать по убыванию единиц измерения
              - Число в секундах
          
            Отрицательные значения обозначаются префиксом "-", в простом формате могут быть ограничены скобками.
            Регистр и пробелы игнорируются
          
            Примеры:
              - "PT1S"
              - "-PT4.2S"
              - "P1DT2H3M4S"
              - "42s"
              - "1h10m42s"
              - "-(1d 2h 3m 4s 5ms 6us 7ns)"
              - "42"
        retryTimeoutScale:
          $ref: '#/components/schemas/RetryTimeoutScale'
          description: Шаг увеличения таймаута
        maxRetryTimeout:
          type: string
          description: |-
            Максимальная длительность таймаута
          
            Поддерживаются следующие форматы:
              - ISO 8601: P(n)DT(n)H(n)M(n)S. Допустимые единицы измерения: дни (`D`), часы (`H`), минуты (`M`), секунды (`S`). Только секунды могут быть дробными
              - Простой формат. Допустимые единицы измерения: `d`, `h`, `m`, `s`, `ms`, `us`, `ns`.
                Величины должны следовать по убыванию единиц измерения
              - Число в секундах
          
            Отрицательные значения обозначаются префиксом "-", в простом формате могут быть ограничены скобками.
            Регистр и пробелы игнорируются
          
            Примеры:
              - "PT1S"
              - "-PT4.2S"
              - "P1DT2H3M4S"
              - "42s"
              - "1h10m42s"
              - "-(1d 2h 3m 4s 5ms 6us 7ns)"
              - "42"
      required:
        - retryCount
        - retryTimeout

    RetryTimeoutScale:
      type: string
      description: Шаг увеличения таймаута
      enum:
        - "FIXED"
        - "LINEAR"
        - "PROGRESSIVE"
        - "EXPONENTIAL"

  securitySchemes:
    BearerAuth:
      description: Токен авторизации IAM
      type: apiKey
      in: header
      name: Authorization

  parameters:
    header_Idempotency-Key:
      name: Idempotency-Key
      in: header
      description: Ключ идемпотентности
      style: simple
      schema:
        type: string

    path_backup:
      name: backup
      in: path
      required: true
      description: Backup базы данных.
      style: simple
      schema:
        type: string

    path_cluster:
      name: cluster
      in: path
      required: true
      description: Название или идентификатор кластера.
      style: simple
      schema:
        type: string
        pattern: ^[a-z]([a-z0-9-]{0,45}[a-z0-9])?$

    path_database:
      name: database
      in: path
      required: true
      description: Имя базы данных.
      style: simple
      schema:
        type: string
        pattern: ^(?!postgres$|template0$|template1$)[a-zA-Z_][a-zA-Z0-9_$-]*$

    path_project:
      name: project
      in: path
      required: true
      description: Путь к проекту.
      style: simple
      schema:
        type: string

    path_user:
      name: user
      in: path
      required: true
      description: Пользователь базы данных.
      style: simple
      schema:
        type: string
        pattern: ^(?!pg_)(?!(DB_OWNER_USER|DB_READER_USER|DB_WRITER_USER|admin|cron_admin|mdb-monitor|postgres|replicator|robot_zmon|zalandos|DB_MIGRATOR_ROLE)$)[a-zA-Z0-9_][a-zA-Z0-9_$-]*$

    query_createOnly:
      name: createOnly
      in: query
      description: Создать ресурс. Если ресурс уже существует, будет возвращен ответ `AlreadyExists`
      style: form
      explode: true
      schema:
        type: boolean

    query_filter:
      name: filter
      in: query
      description: |-
        Строка фильтра.
        Для фильтрации используется ограниченная реализация AIP-160 (https://google.aip.dev/160).
        Она включает в себя операции =, !=, OR, AND и (), фильтрацию свойств вложенных объектов и wildcard-поиск подстрок
      style: form
      explode: true
      schema:
        type: string

    query_orderBy:
      name: orderBy
      in: query
      description: |-
        Строка сортировки.
        Для сортировки используется реализация AIP-132 (https://google.aip.dev/132#ordering).
        Указывается перечислением полей с направлением сортировки (asc, desc) через запятую.
        По умолчанию используется сортировка по возрастанию (asc)
      style: form
      explode: true
      schema:
        type: string

    query_pageSize:
      name: pageSize
      in: query
      description: Максимальное количество объектов, которые клиент готов принять. Сервис определяет значение по умолчанию и верхнюю границу
      style: form
      explode: true
      schema:
        type: integer

    query_pageToken:
      name: pageToken
      in: query
      description: Строка, из предыдущего ответа на аналогичный запрос, для получения следующей страницы с объектами. Не задано для получения первой страницы
      style: form
      explode: true
      schema:
        type: string

    query_showDeleted:
      name: showDeleted
      in: query
      description: Вывод удаленных объектов для ресурсов, поддерживающих soft delete
      style: form
      explode: true
      schema:
        type: string

    query_updateOnly:
      name: updateOnly
      in: query
      description: |-
        Обновить ресурс, если он существует. Если ресурс не существует, будет возвращен ответ `Not Found`.
        Если прав на выполнение операции недостаточно, будет возвращен ответ `PermissionDenied`
      style: form
      explode: true
      schema:
        type: boolean


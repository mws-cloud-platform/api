        ref:
          type: string
          description: |-
            Идентификатор внешнего адреса
          
            Строка в форматах:
              Полный формат:
                - "vpc/projects/{project}/externalAddresses/{externalAddress}"
              Сокращенные форматы:
                - "projects/{project}/externalAddresses/{externalAddress}"
                - "externalAddresses/{externalAddress}"
                - "{externalAddress}"
          
            Полный формат всегда корректен.
            Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
          
            Примеры:
              - "vpc/projects/myProject/externalAddresses/myExternalAddress"
              - "projects/myProject/externalAddresses/myExternalAddress"
              - "externalAddresses/myExternalAddress"
              - "myExternalAddress"

    PostgresNetworkDirectAddressRequest:
      type: object
      description: Описание адресов к инстансам postgres, в которые будет трансляция из service-vpc
      allOf:
        - $ref: '#/components/schemas/PostgresNetworkAddressRequest'
        - type: object
          properties:
            zone:
              type: string
              description: |-
                Зона инстанса, к которому ведет адрес
              
                Строка в форматах:
                  Полный формат:
                    - "rm/zones/{zone}"
                  Сокращенные форматы:
                    - "zones/{zone}"
                    - "{zone}"
              
                Полный формат всегда корректен.
                Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
              
                Примеры:
                  - "rm/zones/myZone"
                  - "zones/myZone"
                  - "myZone"

    PostgresInstanceTemplateRequest:
      type: object
      properties:
        vmType:
          type: string
          description: |-
            Тип виртуальной машины, описывающий ресурсы (vCPU, memory)
          
            Строка в форматах:
              Полный формат:
                - "compute/vmTypes/{vmType}"
              Сокращенные форматы:
                - "vmTypes/{vmType}"
                - "{vmType}"
          
            Полный формат всегда корректен.
            Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
          
            Обязательно для заполнения при создании ресурса
          
            Примеры:
              - "compute/vmTypes/myVmType"
              - "vmTypes/myVmType"
              - "myVmType"
        disk:
          $ref: '#/components/schemas/DataDiskSpecRequest'
          description: |-
            Параметры диска с данными на узле кластера
          
            Обязательно для заполнения при создании ресурса

    DataDiskSpecRequest:
      type: object
      description: Параметры диска с данными на узле кластера
      properties:
        size:
          type: string
          description: |-
            Размер диска
          
            Размер в байтах. Формат: <число> [единица измерения].
            Допустимые единицы измерения: `B`, `KB`, `MB`, `GB`, `TB`, `PB`, `EB`, `ZB`, `YB`, `RB`, `QB`. По умолчанию: `B`.
            Допустимые значения — положительные целые числа и дробные числа с ненулевой целой частью.
            Значение базовой единицы измерения (в байтах) должно оставаться целым.
            Регистр и лишние пробелы перед строкой, после строки и между ее частями игнорируются
          
            Обязательно для заполнения при создании ресурса
          
            Примеры:
              - "1"
              - "1 B"
              - "1024 kb"
              - "1.5 TB"
        type:
          $ref: '#/components/schemas/DataDiskType'
          description: |-
            Тип используемого диска:
            * `NETWORK_STANDARD_SSD` — сетевой SSD
            * `LOCAL` — локальный SSD
          
            Обязательно для заполнения при создании ресурса
        iops:
          $ref: '#/components/schemas/Iops'
          description: IOPS

    PostgresInstanceRequest:
      type: object
      properties:
        count:
          type: integer
          description: |-
            Количество экземпляров в зоне доступности
          
            Обязательно для заполнения при создании ресурса
        zone:
          type: string
          description: Зона доступности

    PostgresClusterBackupRequest:
      type: object
      description: Спецификация автоматического бэкапирования
      properties:
        daily:
          allOf:
            - $ref: '#/components/schemas/PostgresClusterBackupDailyRequest'
          description: Спецификация ежедневного автоматического бэкапирования
          nullable: true
        retainPeriodDays:
          type: integer
          description: Количество дней хранения бэкапа

    PostgresClusterBackupDailyRequest:
      type: object
      description: Спецификация ежедневного автоматического бэкапирования
      properties:
        hour:
          type: integer
          description: Час начала автоматического бэкапирования

    MaintenanceWindowRequest:
      type: object
      properties:
        weekly:
          $ref: '#/components/schemas/WeeklyMaintenanceWindowRequest'
          description: Обязательно для заполнения при создании ресурса

    WeeklyMaintenanceWindowRequest:
      type: object
      properties:
        days:
          type: array
          description: |-
            Дни недели, в которые будет запущено задание на тех. обслуживание
          
            Простая коллекция. При обновлении ресурса простая коллекция, переданная в запросе, полностью заменяет существующую. Подробнее см. в описании метода `Upsert`
          
            Обязательно для заполнения при создании ресурса
          items:
            $ref: '#/components/schemas/DayOfWeek'
        hour:
          type: integer
          description: |-
            Час, в который будет запущено задание на тех. обслуживание
          
            Обязательно для заполнения при создании ресурса
        duration:
          type: string
          description: |-
            Допустимая продолжительность процесса обновления. Если не указано, то не ограничено по времени. Принимается только формат в часах (h)
          
            Поддерживаются следующие форматы:
              - ISO 8601: P(n)DT(n)H(n)M(n)S. Допустимые единицы измерения: дни (`D`), часы (`H`), минуты (`M`), секунды (`S`). Только секунды могут быть дробными
              - Простой формат. Допустимые единицы измерения: `d`, `h`, `m`, `s`, `ms`, `us`, `ns`.
                Величины должны следовать по убыванию единиц измерения
              - Число в секундах
          
            Отрицательные значения обозначаются префиксом "-", в простом формате могут быть ограничены скобками.
            Регистр и пробелы игнорируются
          
            Примеры:
              - "PT1S"
              - "-PT4.2S"
              - "P1DT2H3M4S"
              - "42s"
              - "1h10m42s"
              - "-(1d 2h 3m 4s 5ms 6us 7ns)"
              - "42"
          nullable: true


                  - "clusters/myCluster/roleBindings/myRoleBinding"
                  - "roleBindings/myRoleBinding"
                  - "myRoleBinding"
            databaseId:
              type: string
              description: |-
                Идентификатор базы данных, в которой пользователю назначена роль; `null` — если роль глобальная
              
                Строка в форматах:
                  Полный формат:
                    - "mpostgres/projects/{project}/clusters/{cluster}/databases/{database}"
                  Сокращенные форматы:
                    - "projects/{project}/clusters/{cluster}/databases/{database}"
                    - "clusters/{cluster}/databases/{database}"
                    - "databases/{database}"

                    - "UPGRADING"
                    - "DEGRADED"
                    - "DELETING"
                    - "UNKNOWN"
                  nullable: true
                message:
                  type: string
                  nullable: true
              nullable: true

    LocalDiskStatusResponse:
      type: object
      description: Статус локального диска. Все поля read-only
      properties:
        name:
          type: string
          description: Уникальное имя диска в рамках виртуальной машины
          nullable: true
        deviceName:
          type: string
          description: Имя устройства в `/dev/disk/by-id/mws-*`. Если не указано — `mws-{name}`
          nullable: true
        size:
          type: string
          description: |-
            Размер диска
          
            Размер в байтах. Формат: <число> [единица измерения].
            Допустимые единицы измерения: `B`, `KB`, `MB`, `GB`, `TB`, `PB`, `EB`, `ZB`, `YB`, `RB`, `QB`. По умолчанию: `B`.
            Допустимые значения — положительные целые числа и дробные числа с ненулевой целой частью.
            Значение базовой единицы измерения (в байтах) должно оставаться целым.
            Регистр и лишние пробелы перед строкой, после строки и между ее частями игнорируются
          
            Примеры:
              - "1"
              - "1 B"
              - "1024 kb"
              - "1.5 TB"
          nullable: true

    NodeGroupVersionControlStatusResponse:
      type: object
      properties:
        version:
          type: string
          description: Текущая версия NodeGroup
          nullable: true
        autoUpdate:
          type: boolean
          nullable: true
        maintenanceWindow:
          allOf:
            - $ref: '#/components/schemas/MaintenanceWindow2Response'
          nullable: true

    NodeGroupRequest:
      type: object
      description: |-
        Группа узлов в кластере Managed Kubernetes — это группа виртуальных машин
        Compute, на которых запускаются контейнеры с приложениями
      properties:
        metadata:
          allOf:
            - $ref: '#/components/schemas/CommonTypedResourceMetadataRequest'
          description: Набор общих для всех пользовательских объектов атрибутов. Может быть расширен атрибутами, специфичными для контейнеров
          nullable: true
        spec:
          $ref: '#/components/schemas/NodeGroupSpecRequest'
          description: Обязательно для заполнения при создании ресурса

    NodeGroupSpecRequest:
      type: object
      properties:
        zone:
          type: string
          description: |-
            Обязательно для заполнения при создании ресурса
          
            Неизменяемое поле. Задается только при создании ресурса.
            При обновлении ресурса можно передать только текущее значение
        subnet:
          type: object
          description: |-
            Обязательно для заполнения при создании ресурса
          
            Неизменяемое поле. Задается только при создании ресурса.
            При обновлении ресурса можно передать только текущее значение
          properties:
            ref:
              type: string
              description: |-
                Ссылка на ресурс
              
                Строка в форматах:
                  Полный формат:
                    - "vpc/projects/{project}/networks/{network}/subnets/{subnet}"
                  Сокращенные форматы:
                    - "projects/{project}/networks/{network}/subnets/{subnet}"
                    - "networks/{network}/subnets/{subnet}"
                    - "subnets/{subnet}"
                    - "{subnet}"
              
                Полный формат всегда корректен.
                Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
              
                Обязательно для заполнения при создании ресурса
              
                Примеры:
                  - "vpc/projects/myProject/networks/myNetwork/subnets/mySubnet"
                  - "projects/myProject/networks/myNetwork/subnets/mySubnet"
                  - "networks/myNetwork/subnets/mySubnet"
                  - "subnets/mySubnet"
                  - "mySubnet"
        vmType:
          type: object
          description: |-
            Тип VM
          
            Обязательно для заполнения при создании ресурса
          properties:
            ref:
              type: string
              description: |-
                Ссылка на ресурс
              
                Строка в форматах:
                  Полный формат:
                    - "compute/vmTypes/{vmType}"
                  Сокращенные форматы:
                    - "vmTypes/{vmType}"
                    - "{vmType}"
              
                Полный формат всегда корректен.
                Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
              
                Обязательно для заполнения при создании ресурса
              
                Примеры:
                  - "compute/vmTypes/myVmType"
                  - "vmTypes/myVmType"
                  - "myVmType"
        imageStorageSize:
          type: string
          description: |-
            Размер хранилища для образов и контейнеров, в Gb
          
            Размер в байтах. Формат: <число> [единица измерения].
            Допустимые единицы измерения: `B`, `KB`, `MB`, `GB`, `TB`, `PB`, `EB`, `ZB`, `YB`, `RB`, `QB`. По умолчанию: `B`.
            Допустимые значения — положительные целые числа и дробные числа с ненулевой целой частью.
            Значение базовой единицы измерения (в байтах) должно оставаться целым.
            Регистр и лишние пробелы перед строкой, после строки и между ее частями игнорируются
          
            Примеры:
              - "1"
              - "1 B"
              - "1024 kb"
              - "1.5 TB"
          default: 15Gb
        imageStorageIops:
          type: integer
          description: Количество операций ввода-вывода в секунду (IOPS) для хранилища образов и контейнеров
          format: int64
          default: 1000
        localDisks:
          type: array
          description: |-
            Параметры локальных дисков для каждого узла в группе узлов
          
            Простая коллекция. При обновлении ресурса простая коллекция, переданная в запросе, полностью заменяет существующую. Подробнее см. в описании метода `Upsert`
          items:
            $ref: '#/components/schemas/LocalDiskSpecRequest'
          nullable: true
        scale:
          type: object
          description: |-
            Необходимо заполнить одно из полей — "fixed" или "autoscaling"
          
            Обязательно для заполнения при создании ресурса
          properties:
            fixed:
              type: integer
              description: Количество узлов в группе узлов
              nullable: true
            autoscaling:
              type: object
              properties:
                min:
                  type: integer
                  description: |-
                    Минимально количество узлов в группе узлов
                  
                    Обязательно для заполнения при создании ресурса
                max:
                  type: integer
                  description: |-
                    Максимальное количество узлов в группе узлов
                  
                    Обязательно для заполнения при создании ресурса
              nullable: true
        labels:
          type: array
          description: Простая коллекция. При обновлении ресурса простая коллекция, переданная в запросе, полностью заменяет существующую. Подробнее см. в описании метода `Upsert`
          items:
            $ref: '#/components/schemas/NodeLabelSpecRequest'
          nullable: true
        taints:
          type: array
          description: Простая коллекция. При обновлении ресурса простая коллекция, переданная в запросе, полностью заменяет существующую. Подробнее см. в описании метода `Upsert`
          items:
            $ref: '#/components/schemas/NodeTaintSpecRequest'
          nullable: true
        versionControl:
          $ref: '#/components/schemas/NodeGroupVersionControlSpecRequest'
          description: Обязательно для заполнения при создании ресурса
        rolloutStrategy:
          type: object
          description: |-
            Стратегия обновления (rollout) узлов в группе узлов
          
            Обязательно для заполнения при создании ресурса
          properties:
            maxSurge:
              type: integer
              default: 1
            maxUnavailable:
              type: integer
        serviceAccount:
          type: object
          description: |-
            Сервисный аккаунт для выполнения функций:
            - скачивание образов из Artifact Registry (требуются права на чтение образов);
            - сбор системных метрик с узлов (требуются права на чтение статусов узлов)
          
            Обязательно для заполнения при создании ресурса
          properties:
            ref:
              type: string
              description: |-
                Ссылка на ресурс
              
                Строка в форматах:
                  Полный формат:
                    - "iam/projects/{project}/serviceAccounts/{serviceAccount}"
                  Сокращенные форматы:
                    - "projects/{project}/serviceAccounts/{serviceAccount}"
                    - "serviceAccounts/{serviceAccount}"
                    - "{serviceAccount}"
              
                Полный формат всегда корректен.
                Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
              
                Обязательно для заполнения при создании ресурса
              
                Примеры:
                  - "iam/projects/myProject/serviceAccounts/myServiceAccount"
                  - "projects/myProject/serviceAccounts/myServiceAccount"
                  - "serviceAccounts/myServiceAccount"
                  - "myServiceAccount"

    LocalDiskSpecRequest:
      type: object
      properties:
        name:
          type: string
          description: |-
            Уникальное имя диска в рамках виртуальной машины
          
            Обязательно для заполнения при создании ресурса
        deviceName:
          type: string
          description: Имя устройства в /dev/disk/by-id/mws-*. Если не указано — mws-{name}
          nullable: true
        size:
          type: string
          description: |-
            Размер диска. Должен быть кратен 248GB
          
            Размер в байтах. Формат: <число> [единица измерения].
            Допустимые единицы измерения: `B`, `KB`, `MB`, `GB`, `TB`, `PB`, `EB`, `ZB`, `YB`, `RB`, `QB`. По умолчанию: `B`.
            Допустимые значения — положительные целые числа и дробные числа с ненулевой целой частью.
            Значение базовой единицы измерения (в байтах) должно оставаться целым.
            Регистр и лишние пробелы перед строкой, после строки и между ее частями игнорируются
          
            Обязательно для заполнения при создании ресурса
          
            Примеры:
              - "1"
              - "1 B"
              - "1024 kb"
              - "1.5 TB"

    NodeLabelSpecRequest:
      type: object
      properties:
        key:
          type: string
          description: |-
            Ключ может состоять из двух частей: необязательный префикс и ключ, разделенные '/'
            Максимальная длина префикса 253 символа.
            Максимальная длина ключа 63 символа
          
            Обязательно для заполнения при создании ресурса
        value:
          type: string
          description: |-
            Значение метки на узле
          
            Обязательно для заполнения при создании ресурса

    NodeTaintSpecRequest:
      type: object
      properties:
        key:
          type: string
          description: |-
            Ключ может состоять из двух частей: необязательный префикс и ключ, разделенные "/".
            Максимальная длина префикса 253 символа.
            Максимальная длина ключа 63 символа
          
            Обязательно для заполнения при создании ресурса
        value:
          type: string
          description: |-
            Значение taint на node. Если строка пустая, то value нет
          
            Обязательно для заполнения при создании ресурса
        effect:
          type: string
          description: |-
            Эффект taint на node, влияющий на pod scheduling, которые под него попадают
          
            Обязательно для заполнения при создании ресурса
          enum:
            - "NO_SCHEDULE"
            - "PREFER_NO_SCHEDULE"
            - "NO_EXECUTE"

    NodeGroupVersionControlSpecRequest:
      type: object
      properties:
        version:
          type: string
          description: Минимальная версия NodeGroup. Не может быть выше версии кластера.  Автоматически обновляется до default-версии в окно обслуживания. Если указанная версия выше текущей, обновление запустится немедленно. Во время автоматического обновления это поле не изменяется, а актуальная версия указывается в статусе NodeGroup
          nullable: true
        autoUpdate:
          type: boolean
          description: Авто обновление версии нод группы в рамках релизного канала и окна обслуживания
          default: true
        maintenanceWindow:
          allOf:
            - $ref: '#/components/schemas/MaintenanceWindowRequest'
          description: Если окно обслуживания не заполнено, то время проведения работ не ограничено. Duration можно указывать. Если отсутствует, то не ограничено по времени
          nullable: true

    ApiError:
      type: object
      description: Описание ошибки (если HTTP-статус отличен от 2xx)
      properties:
        code:
          type: string
          description: Короткий код ошибки
          enum:
            - "ALREADY_EXISTS"
            - "CANCELLED"
            - "DEADLINE_EXCEEDED"
            - "FAILED_PRECONDITION"
            - "INTERNAL"
            - "INVALID_ARGUMENT"
            - "NOT_FOUND"
            - "PERMISSION_DENIED"
            - "QUOTA_EXCEEDED"
            - "IDEMPOTENCY_KEY_ALREADY_USED"
            - "INVALID_ETAG_KEY"
            - "UNAUTHENTICATED"
            - "UNAVAILABLE"
            - "METHOD_NOT_ALLOWED"
            - "TOO_MANY_REQUESTS"
        type:
          type: string
          description: Подтип расширенной информации по ошибкам к которому удалось его привести. Null если привели к базовому типу
        description:
          type: string
          description: Развёрнутое пояснение ошибки
        retryPolicy:
          allOf:
            - $ref: '#/components/schemas/RetryPolicy'
          description: Правила выполнения повторных попыток в случае ошибки
          nullable: true
        details:
          type: object
          description: |-
            Детальная информация по ошибке в произвольном JSON формате. Содержимое не предназначено для машинной обработки
          
            Примеры:
              - '{"jsonPaths": [{"path": "foo.bar", "reason": "some reason", "offset": "line: 1, column: 2"}]}'
              - '{"errorInfo": "some error info"}'
          additionalProperties: true
      required:
        - code

    RetryPolicy:
      type: object
      description: Правила выполнения повторных попыток в случае ошибки
      properties:
        retryCount:
          type: integer
          description: Максимальное количество повторных попыток. 0 - значение по-умолчанию
        retryTimeout:
          type: string
          description: |-
            Пауза между повторными попытками
          
            Поддерживаются следующие форматы:
              - ISO 8601: P(n)DT(n)H(n)M(n)S. Допустимые единицы измерения: дни (`D`), часы (`H`), минуты (`M`), секунды (`S`). Только секунды могут быть дробными
              - Простой формат. Допустимые единицы измерения: `d`, `h`, `m`, `s`, `ms`, `us`, `ns`.
                Величины должны следовать по убыванию единиц измерения
              - Число в секундах
          
            Отрицательные значения обозначаются префиксом "-", в простом формате могут быть ограничены скобками.
            Регистр и пробелы игнорируются
          
            Примеры:
              - "PT1S"
              - "-PT4.2S"
              - "P1DT2H3M4S"
              - "42s"
              - "1h10m42s"
              - "-(1d 2h 3m 4s 5ms 6us 7ns)"
              - "42"
        retryTimeoutScale:
          $ref: '#/components/schemas/RetryTimeoutScale'
          description: Шаг увеличения таймаута
        maxRetryTimeout:
          type: string
          description: |-
            Максимальная длительность таймаута
          
            Поддерживаются следующие форматы:
              - ISO 8601: P(n)DT(n)H(n)M(n)S. Допустимые единицы измерения: дни (`D`), часы (`H`), минуты (`M`), секунды (`S`). Только секунды могут быть дробными
              - Простой формат. Допустимые единицы измерения: `d`, `h`, `m`, `s`, `ms`, `us`, `ns`.
                Величины должны следовать по убыванию единиц измерения
              - Число в секундах
          
            Отрицательные значения обозначаются префиксом "-", в простом формате могут быть ограничены скобками.
            Регистр и пробелы игнорируются
          
            Примеры:
              - "PT1S"
              - "-PT4.2S"
              - "P1DT2H3M4S"
              - "42s"
              - "1h10m42s"
              - "-(1d 2h 3m 4s 5ms 6us 7ns)"
              - "42"
      required:
        - retryCount
        - retryTimeout

    RetryTimeoutScale:
      type: string
      description: Шаг увеличения таймаута
      enum:
        - "FIXED"
        - "LINEAR"
        - "PROGRESSIVE"
        - "EXPONENTIAL"

  securitySchemes:
    BearerAuth:
      description: Токен авторизации IAM
      type: apiKey
      in: header
      name: Authorization

  parameters:
    header_Idempotency-Key:
      name: Idempotency-Key
      in: header
      description: Ключ идемпотентности
      style: simple
      schema:
        type: string

    path_clusterName:
      name: clusterName
      in: path
      required: true
      description: Имя Cluster
      style: simple
      schema:
        type: string
        example: mws-taovchi1-by75d03
        pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$

    path_nodeGroupName:
      name: nodeGroupName
      in: path
      required: true
      description: Имя Node-группы
      style: simple
      schema:
        type: string
        example: ng-01
        pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$

    path_project:
      name: project
      in: path
      required: true
      description: Путь к проекту.
      style: simple
      schema:
        type: string

    path_releaseChannelName:
      name: releaseChannelName
      in: path
      required: true
      description: Имя Release Channel
      style: simple
      schema:
        type: string
        example: stable

    query_clusterName:
      name: clusterName
      in: query
      description: Имя Cluster
      style: form
      explode: true
      schema:
        type: string
        example: mws-taovchi1-by75d03
        pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$

    query_createOnly:
      name: createOnly
      in: query
      description: Создать ресурс. Если ресурс уже существует, будет возвращен ответ `AlreadyExists`
      style: form
      explode: true
      schema:
        type: boolean

    query_filter:
      name: filter
      in: query
      description: |-
        Строка фильтра.
        Для фильтрации используется ограниченная реализация AIP-160 (https://google.aip.dev/160).
        Она включает в себя операции =, !=, OR, AND и (), фильтрацию свойств вложенных объектов и wildcard-поиск подстрок
      style: form
      explode: true
      schema:
        type: string

    query_nodeGroupName:
      name: nodeGroupName
      in: query
      description: Имя Node Group-ы
      style: form
      explode: true
      schema:
        type: string
        example: mws-taovchi1-by75d03
        pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$

    query_orderBy:
      name: orderBy
      in: query
      description: |-
        Строка сортировки.
        Для сортировки используется реализация AIP-132 (https://google.aip.dev/132#ordering).
        Указывается перечислением полей с направлением сортировки (asc, desc) через запятую.
        По умолчанию используется сортировка по возрастанию (asc)
      style: form
      explode: true
      schema:
        type: string

    query_pageSize:
      name: pageSize
      in: query
      description: Максимальное количество объектов, которые клиент готов принять. Сервис определяет значение по умолчанию и верхнюю границу
      style: form
      explode: true
      schema:
        type: integer

    query_pageToken:
      name: pageToken
      in: query
      description: Строка, из предыдущего ответа на аналогичный запрос, для получения следующей страницы с объектами. Не задано для получения первой страницы
      style: form
      explode: true
      schema:
        type: string

    query_subject:
      name: subject
      in: query
      description: Объект получения версий, возможные варианты значений cluster или nodeGroup
      style: form
      explode: true
      schema:
        type: string
        default: cluster
        example: cluster
        pattern: ^[a-z][A-Za-z]{0,19}$

    query_updateOnly:
      name: updateOnly
      in: query
      description: |-
        Обновить ресурс, если он существует. Если ресурс не существует, будет возвращен ответ `Not Found`.
        Если прав на выполнение операции недостаточно, будет возвращен ответ `PermissionDenied`
      style: form
      explode: true
      schema:
        type: boolean


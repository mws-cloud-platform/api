    NodeGroupResponse:
      type: object
      description: |-
        Группа узлов в кластере Managed Kubernetes — это группа виртуальных машин
        Compute, на которых запускаются контейнеры с приложениями
      properties:
        kind:
          type: string
          default: mk8s/v1/NodeGroup
        metadata:
          allOf:
            - $ref: '#/components/schemas/CommonTypedResourceMetadataResponse'
          description: Набор общих для всех пользовательских объектов атрибутов. Может быть расширен атрибутами, специфичными для контейнеров
          nullable: true
        spec:
          $ref: '#/components/schemas/NodeGroupSpecResponse'
        status:
          allOf:
            - $ref: '#/components/schemas/NodeGroupStatusResponse'
          description: Описывает статусную модель групп узлов Kubernetes
          nullable: true
      required:
        - spec

    NodeGroupSpecResponse:
      type: object
      properties:
        zone:
          type: string
          description: |-
            Неизменяемое поле. Задается только при создании ресурса.
            При обновлении ресурса можно передать только текущее значение
        subnet:
          type: object
          description: |-
            Неизменяемое поле. Задается только при создании ресурса.
            При обновлении ресурса можно передать только текущее значение
          properties:
            ref:
              type: string
              description: |-
                Ссылка на ресурс
              
                Строка в форматах:
                  Полный формат:
                    - "vpc/projects/{project}/networks/{network}/subnets/{subnet}"
                  Сокращенные форматы:
                    - "projects/{project}/networks/{network}/subnets/{subnet}"
                    - "networks/{network}/subnets/{subnet}"
                    - "subnets/{subnet}"
                    - "{subnet}"
              
                Полный формат всегда корректен.
                Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
              
                Примеры:
                  - "vpc/projects/myProject/networks/myNetwork/subnets/mySubnet"
                  - "projects/myProject/networks/myNetwork/subnets/mySubnet"
                  - "networks/myNetwork/subnets/mySubnet"
                  - "subnets/mySubnet"
                  - "mySubnet"
          required:
            - ref
        vmType:
          type: object
          description: Тип VM
          properties:
            ref:
              type: string
              description: |-
                Ссылка на ресурс
              
                Строка в форматах:
                  Полный формат:
                    - "compute/vmTypes/{vmType}"
                  Сокращенные форматы:
                    - "vmTypes/{vmType}"
                    - "{vmType}"
              
                Полный формат всегда корректен.
                Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
              
                Примеры:
                  - "compute/vmTypes/myVmType"
                  - "vmTypes/myVmType"
                  - "myVmType"
          required:
            - ref
        imageStorageSize:
          type: string
          description: |-
            Размер хранилища для образов и контейнеров, в Gb
          
            Размер в байтах. Формат: <число> [единица измерения].
            Допустимые единицы измерения: `B`, `KB`, `MB`, `GB`, `TB`, `PB`, `EB`, `ZB`, `YB`, `RB`, `QB`. По умолчанию: `B`.
            Допустимые значения — положительные целые числа и дробные числа с ненулевой целой частью.
            Значение базовой единицы измерения (в байтах) должно оставаться целым.
            Регистр и лишние пробелы перед строкой, после строки и между ее частями игнорируются
          
            Примеры:
              - "1"
              - "1 B"
              - "1024 kb"
              - "1.5 TB"
          default: 15Gb
        imageStorageIops:
          type: integer
          description: Количество операций ввода-вывода в секунду (IOPS) для хранилища образов и контейнеров
          format: int64
          default: 1000
        localDisks:
          type: array
          description: Параметры локальных дисков для каждого узла в группе узлов
          items:
            $ref: '#/components/schemas/LocalDiskSpecResponse'
          nullable: true
        scale:
          type: object
          description: Необходимо заполнить одно из полей — "fixed" или "autoscaling"
          properties:
            fixed:
              type: integer
              description: Количество узлов в группе узлов
              nullable: true
            autoscaling:
              type: object
              properties:
                min:
                  type: integer
                  description: Минимально количество узлов в группе узлов
                max:
                  type: integer
                  description: Максимальное количество узлов в группе узлов
              required:
                - min
                - max
              nullable: true
        labels:
          type: array
          items:
            $ref: '#/components/schemas/NodeLabelSpecResponse'
          nullable: true
        taints:
          type: array
          items:
            $ref: '#/components/schemas/NodeTaintSpecResponse'
          nullable: true
        versionControl:
          $ref: '#/components/schemas/NodeGroupVersionControlSpecResponse'
        rolloutStrategy:
          type: object
          description: Стратегия обновления (rollout) узлов в группе узлов
          properties:
            maxSurge:
              type: integer
              default: 1
            maxUnavailable:
              type: integer
        serviceAccount:
          type: object
          description: |-
            Сервисный аккаунт для выполнения функций:
            - скачивание образов из Artifact Registry (требуются права на чтение образов);
            - сбор системных метрик с узлов (требуются права на чтение статусов узлов)
          properties:
            ref:
              type: string
              description: |-
                Ссылка на ресурс
              
                Строка в форматах:
                  Полный формат:
                    - "iam/projects/{project}/serviceAccounts/{serviceAccount}"
                  Сокращенные форматы:
                    - "projects/{project}/serviceAccounts/{serviceAccount}"
                    - "serviceAccounts/{serviceAccount}"
                    - "{serviceAccount}"
              
                Полный формат всегда корректен.
                Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
              
                Примеры:
                  - "iam/projects/myProject/serviceAccounts/myServiceAccount"
                  - "projects/myProject/serviceAccounts/myServiceAccount"
                  - "serviceAccounts/myServiceAccount"
                  - "myServiceAccount"
          required:
            - ref
      required:
        - zone
        - subnet
        - vmType
        - scale
        - versionControl
        - rolloutStrategy
        - serviceAccount


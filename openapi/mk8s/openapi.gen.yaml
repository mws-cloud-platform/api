components:
  schemas:
    ProjectStatisticsResponse:
      type: object
      properties:
        clusterCount:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
      required:
        - clusterCount
        - updatedAt

    ReleaseChannelResponse:
      type: object
      properties:
        name:
          type: string
          description: Если release channel name не указан, то будет проставлено default значение stable
        description:
          type: string
          nullable: true
        enabled:
          type: boolean
          description: Если false, то релизный канал не доступен для выбора
      required:
        - name
        - enabled

    ClusterListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClusterResponse'
        nextPageToken:
          allOf:
            - $ref: '#/components/schemas/NextPageToken'
          description: Строка, которую нужно передать в следующем запросе, чтобы получить следующую страницу. Для последней страницы не задан
          nullable: true
      required:
        - items

    ClusterResponse:
      type: object
      description: |-
        Кластер Managed Kubernetes — кластер Kubernetes на базе облачной
        инфраструктуры MWS Cloud Platform. Представляет собой совокупность Control
        Plane (управляющего слоя) и групп рабочих узлов
      properties:
        kind:
          type: string
          default: mk8s/v1/Cluster
        metadata:
          allOf:
            - $ref: '#/components/schemas/CommonTypedResourceMetadataResponse'
          description: Набор общих для всех пользовательских объектов атрибутов. Может быть расширен атрибутами, специфичными для контейнеров
          nullable: true
        spec:
          $ref: '#/components/schemas/ClusterSpecResponse'
        status:
          allOf:
            - $ref: '#/components/schemas/ClusterStatusResponse'
          description: Описывает статусную модель k8s cluster
          nullable: true
      required:
        - spec

    CommonTypedResourceMetadataResponse:
      type: object
      description: Набор общих для всех пользовательских объектов атрибутов. Может быть расширен атрибутами, специфичными для контейнеров
      properties:
        id:
          type: string
          description: |-
            ID свойства
          
            Строка в формате: "servicename/foos/{foo}/bars/{bar}"
          
            Пример: "servicename/foos/myFoo/bars/myBar"
        displayName:
          type: string
          description: Отображаемое имя свойства
        createTime:
          type: string
          description: Дата создания объекта
          format: date-time
        updateTime:
          type: string
          description: Дата последнего изменения объекта
          format: date-time
        deleteTime:
          type: string
          description: Время запроса на удаление ресурса
          format: date-time
        purgeTime:
          type: string
          description: Время удаления ресурса
          format: date-time
        usages:
          type: array
          description: Связи с другими ресурсами. В зависимости от типа связи операции над ресурсом могут быть ограничены
          items:
            $ref: '#/components/schemas/UsageResponse'
        etag:
          type: string
          description: Идентификатор состояния ресурса, позволяет отслеживать изменение ресурса
        description:
          type: string
          description: Описание ресурса

    UsageResponse:
      type: object
      description: Связь ресурса с другим ресурсом. В зависимости от типа связи операции над ресурсом могут быть ограничены
      properties:
        usageType:
          type: string
          description: Тип связи. Помимо стандартных `own` и `use` могут быть добавлены специализированные типы для конкретных сервисов
        name:
          type: string
          description: Имя связи. Требуется для модификации коллекции
        resource:
          type: string
          description: Ссылка на ресурс
      required:
        - usageType
        - name
        - resource

    ClusterSpecResponse:
      type: object
      properties:
        availability:
          $ref: '#/components/schemas/ClusterAvailabilitySpecResponse'
          description: |-
            Неизменяемое поле. Задается только при создании ресурса.
            При обновлении ресурса можно передать только текущее значение
        network:
          type: object
          properties:
            primaryEndpoint:
              $ref: '#/components/schemas/ClusterPrimaryEndpointSpecOrRefResponse'
              description: |-
                Ip-адрес внутри vpc
              
                Неизменяемое поле. Задается только при создании ресурса.
                При обновлении ресурса можно передать только текущее значение
            publicEndpoint:
              allOf:
                - $ref: '#/components/schemas/ClusterPublicEndpointSpecOrRefResponse'
              description: Внешний ip-адрес
              nullable: true
            podsCidr:
              type: string
              description: |-
                Необходим ip-range v4
              
                IPv4 подсеть в CIDR нотации
              
                Неизменяемое поле. Задается только при создании ресурса.
                При обновлении ресурса можно передать только текущее значение
              
                Пример: "192.168.1.0/24"
              example: 10.222.0.0/18
            servicesCidr:
              type: string
              description: |-
                Необходим ip-range v4
              
                IPv4 подсеть в CIDR нотации
              
                Неизменяемое поле. Задается только при создании ресурса.
                При обновлении ресурса можно передать только текущее значение
              
                Пример: "192.168.1.0/24"
              example: 10.222.64.0/18
          required:
            - primaryEndpoint
            - podsCidr
            - servicesCidr
        versionControl:
          $ref: '#/components/schemas/ClusterVersionControlSpecResponse'
        plugins:
          allOf:
            - $ref: '#/components/schemas/PluginsSpecResponse'
          nullable: true
        securityPosture:
          allOf:
            - $ref: '#/components/schemas/SecurityPostureSpecResponse'
          description: Настройка KSP для кластера
          nullable: true
      required:
        - availability
        - network
        - versionControl

    ClusterAvailabilitySpecResponse:
      type: object
      properties:
        standalone:
          type: object
          description: |-
            Кластер с одним мастером
          
            Неизменяемое поле. Задается только при создании ресурса.
            При обновлении ресурса можно передать только текущее значение
          properties:
            zone:
              type: string
              description: |-
                Имя зоны для размещения cluster
              
                Неизменяемое поле. Задается только при создании ресурса.
                При обновлении ресурса можно передать только текущее значение
          required:
            - zone
          nullable: true
        zonalHa:
          type: object
          description: |-
            Зональный высокодоступный кластер с несколькими мастерами
          
            Неизменяемое поле. Задается только при создании ресурса.
            При обновлении ресурса можно передать только текущее значение
          properties:
            zone:
              type: string
              description: |-
                Имя зоны для размещения cluster
              
                Неизменяемое поле. Задается только при создании ресурса.
                При обновлении ресурса можно передать только текущее значение
          required:
            - zone
          nullable: true

    ClusterPrimaryEndpointSpecOrRefResponse:
      type: object
      description: Ip-адрес внутри vpc
      properties:
        ref:
          type: string
          description: |-
            Ссылка на ресурс
          
            Строка в форматах:
              Полный формат:
                - "vpc/projects/{project}/networks/{network}/addresses/{address}"
              Сокращенные форматы:
                - "projects/{project}/networks/{network}/addresses/{address}"
                - "networks/{network}/addresses/{address}"
                - "addresses/{address}"
                - "{address}"
          
            Полный формат всегда корректен.
            Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
          
            Неизменяемое поле. Задается только при создании ресурса.
            При обновлении ресурса можно передать только текущее значение
          
            Примеры:
              - "vpc/projects/myProject/networks/myNetwork/addresses/myAddress"
              - "projects/myProject/networks/myNetwork/addresses/myAddress"
              - "networks/myNetwork/addresses/myAddress"
              - "addresses/myAddress"

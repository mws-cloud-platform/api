    BearerAuth:
      description: Токен авторизации IAM
      type: apiKey
      in: header
      name: Authorization

  parameters:
    header_Idempotency-Key:
      name: Idempotency-Key
      in: header
      description: Ключ идемпотентности
      style: simple
      schema:
        type: string

    path_disk:
      name: disk
      in: path
      required: true
      description: Путь к диску
      style: simple
      schema:
        type: string
        pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$

    path_diskBackup:
      name: diskBackup
      in: path
      required: true
      description: Путь к резервной копии диска
      style: simple
      schema:
        type: string
        pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$

    path_image:
      name: image
      in: path
      required: true
      description: Путь к образу
      style: simple
      schema:
        type: string
        pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$

    path_project:
      name: project
      in: path
      required: true
      description: Путь к проекту
      style: simple
      schema:
        type: string
        pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$

    path_project_3c749d5b:
      name: project
      in: path
      required: true
      description: Путь к проекту
      style: simple
      schema:
        type: string

    path_type:
      name: type
      in: path
      required: true
      description: Путь к типу диска
      style: simple
      schema:
        type: string
        pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$

    path_virtualMachine:
      name: virtualMachine
      in: path
      required: true
      style: simple
      schema:
        type: string
        pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$

    path_virtualMachine_fee3aaeb:
      name: virtualMachine
      in: path
      required: true
      style: simple
      schema:
        type: string

    path_vmType:
      name: vmType
      in: path
      required: true
      style: simple
      schema:
        type: string
        pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$

    query_createOnly:
      name: createOnly
      in: query
      description: Создать ресурс. Если ресурс уже существует, будет возвращен ответ `AlreadyExists`
      style: form
      explode: true
      schema:
        type: boolean

    query_family:
      name: family
      in: query
      required: true
      description: Семейство образа
      style: form
      explode: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{0,61}[a-z0-9]$

    query_filter:
      name: filter
      in: query
      description: |-
        Строка фильтра.
        Для фильтрации используется ограниченная реализация AIP-160 (https://google.aip.dev/160).
        Она включает в себя операции =, !=, OR, AND и (), фильтрацию свойств вложенных объектов и wildcard-поиск подстрок
      style: form
      explode: true
      schema:
        type: string

    query_orderBy:
      name: orderBy
      in: query
      description: |-
        Строка сортировки.
        Для сортировки используется реализация AIP-132 (https://google.aip.dev/132#ordering).
        Указывается перечислением полей с направлением сортировки (asc, desc) через запятую.
        По умолчанию используется сортировка по возрастанию (asc)
      style: form
      explode: true
      schema:
        type: string

    query_pageSize:
      name: pageSize
      in: query
      description: Максимальное количество объектов, которые клиент готов принять. Сервис определяет значение по умолчанию и верхнюю границу
      style: form
      explode: true
      schema:
        type: integer

    query_pageToken:
      name: pageToken
      in: query
      description: Строка, из предыдущего ответа на аналогичный запрос, для получения следующей страницы с объектами. Не задано для получения первой страницы
      style: form
      explode: true
      schema:
        type: string

    query_purge:
      name: purge
      in: query
      description: Удалить ресурс без возможности восстановления
      style: form
      explode: true
      schema:
        type: boolean

    query_serialPort:
      name: serialPort
      in: query
      required: true
      style: form
      explode: true
      schema:
        type: integer

    query_updateOnly:
      name: updateOnly
      in: query
      description: |-
        Обновить ресурс, если он существует. Если ресурс не существует, будет возвращен ответ `Not Found`.
        Если прав на выполнение операции недостаточно, будет возвращен ответ `PermissionDenied`
      style: form
      explode: true
      schema:
        type: boolean

    query_waitNew:
      name: waitNew
      in: query
      description: Текущее значение ETag. При передаче параметра сервис будет ждать изменений в ресурсе до тех пор, пока значение ETag не будет изменено
      style: form
      explode: true
      schema:
        type: string


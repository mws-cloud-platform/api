          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  schemas:
    VmTypesListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VmTypeResponse'
        nextPageToken:
          $ref: '#/components/schemas/NextPageToken'
          description: Строка, которую нужно передать в следующем запросе, чтобы получить следующую страницу. Для последней страницы не задан
      required:
        - items

    VmTypeResponse:
      type: object
      description: Тип ВМ
      properties:
        kind:
          type: string
          description: Тип объекта - vmType
          default: compute/v1/vmType
        metadata:
          type: object
          description: Метаданные типа ВМ
          allOf:
            - $ref: '#/components/schemas/TypedResourceMetadataResponse'
            - type: object
              properties:
                id:
                  type: string
                  description: |-
                    ID свойства
                  
                    Строка в формате: "compute/vmTypes/{vmType}"
                  
                    Пример: "compute/vmTypes/myVmType"
              required:
                - id
          nullable: true
        spec:
          $ref: '#/components/schemas/VmTypeSpecResponse'
          description: Спецификация типа ВМ
        status:
          allOf:
            - $ref: '#/components/schemas/VmTypeStatusResponse'
          description: Статус типа ВМ
          nullable: true
      required:
        - spec

    TypedResourceMetadataResponse:
      type: object
      description: Набор общих для всех пользовательских объектов атрибутов. Может быть расширен атрибутами, специфичными для контейнеров
      properties:
        displayName:
          type: string
          description: Отображаемое имя. Необязательное поле, можно свободно задавать и изменять для удобства организации ресурсов
        createTime:
          type: string
          description: Дата создания объекта
          format: date-time
        updateTime:
          type: string
          description: Дата последнего изменения объекта
          format: date-time
        deleteTime:
          type: string
          description: Время запроса на удаление ресурса (не фактическое время удаления)
          format: date-time
        purgeTime:
          type: string
          format: date-time
        usages:
          type: array
          description: Связи с другими ресурсами. В зависимости от типа связи, операции над ресурсом могут быть ограничены
          items:
            $ref: '#/components/schemas/TypedUsageResponse'
        etag:
          type: string
          description: Идентификатор состояния ресурса, позволяет отслеживать изменение ресурса
        description:
          type: string
          description: Описание ресурса

    TypedUsageResponse:
      type: object
      properties:
        usageType:
          type: string
          description: Тип связи. Помимо стандартных own и use могут быть добавлены специализированные типы для конкретных сервисов
        resource:
          type: string
          description: |-
            Ссылка на ресурс
          
            Строка в формате: "servicename/foos/{foo}/bars/{bar}"
          
            Пример: "servicename/foos/myFoo/bars/myBar"
      required:
        - usageType
        - resource

    VmTypeSpecResponse:
      type: object
      description: Спецификация типа ВМ
      properties:
        cpu:
          allOf:
            - $ref: '#/components/schemas/VmTypeCpuSpecResponse'
          description: Спецификация процессора, который доступен для ВМ указанного типа
          nullable: true
        memory:
          allOf:
            - $ref: '#/components/schemas/VmTypeMemorySpecResponse'
          description: Спецификация RAM, которая доступна для ВМ указанного типа
          nullable: true
        disks:
          allOf:
            - $ref: '#/components/schemas/VmTypeDisksSpecResponse'
          description: Спецификация сетевых дисков, которые доступны для ВМ указанного типа
          nullable: true
        localDisks:
          allOf:
            - $ref: '#/components/schemas/VmTypeLocalDisksSpecResponse'
          description: Спецификация локальных дисков, которые доступны для ВМ указанного типа
          nullable: true
        network:
          type: object
          description: Спецификация сети, которая доступна для ВМ указанного типа
          nullable: true

    VmTypeCpuSpecResponse:
      type: object
      description: Спецификация процессора, который доступен для ВМ указанного типа
      properties:
        vcpuCount:
          type: string
          description: Количество виртуальных ядер
          format: int32

    VmTypeMemorySpecResponse:
      type: object
      description: Спецификация RAM, которая доступна для ВМ указанного типа
      properties:
        capacity:
          type: string
          description: |-
            Количество оперативной памяти
          
            Размер в байтах. Формат: <число> [единица измерения].
            Допустимые единицы измерения: `B`, `KB`, `MB`, `GB`, `TB`, `PB`, `EB`, `ZB`, `YB`, `RB`, `QB`. По умолчанию: `B`.
            Допустимые значения — положительные целые числа и дробные числа с ненулевой целой частью.
            Значение базовой единицы измерения (в байтах) должно оставаться целым.
            Регистр и лишние пробелы перед строкой, после строки и между ее частями игнорируются
          
            Примеры:
              - "1"
              - "1 B"
              - "1024 kb"
              - "1.5 TB"

    VmTypeDisksSpecResponse:
      type: object
      description: Спецификация сетевых дисков, которые доступны для ВМ указанного типа
      properties:
        totalIops:
          type: string
          description: Максимальное количество операций ввода-вывода в секунду (IOPS) на ВМ. Зависит от количества виртуальных процессорных ядер (vCPU) у ВМ
          format: int32

    VmTypeLocalDisksSpecResponse:
      type: object
      description: Спецификация локальных дисков, которые доступны для ВМ указанного типа
      properties:
        limits:
          allOf:
            - $ref: '#/components/schemas/VmTypeLocalDiskLimitsSpecResponse'
          description: Спецификация лимитов локальных дисков для ВМ указанного типа
          nullable: true

    VmTypeLocalDiskLimitsSpecResponse:
      type: object
      description: Спецификация лимитов локальных дисков для ВМ указанного типа
      properties:
        disk:
          allOf:
            - $ref: '#/components/schemas/SingleLocalDiskLimitsSpecResponse'
          description: Спецификация лимитов одного локального диска доступного для ВМ указанного типа
          nullable: true
        total:
          allOf:
            - $ref: '#/components/schemas/TotalLocalDiskLimitsSpecResponse'
          description: Спецификация общих лимитов локальных дисков для ВМ указанного типа
          nullable: true

    SingleLocalDiskLimitsSpecResponse:
      type: object
      description: Спецификация лимитов одного локального диска доступного для ВМ указанного типа
      properties:

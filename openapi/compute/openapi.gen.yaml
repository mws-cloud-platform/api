        - BearerAuth: []
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskResponse'
        default:
          description: Допустимые HTTP-коды ошибок — 400, 403, 404, 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags:
        - disk
      summary: Удалить диск
      operationId: DeleteDisk
      parameters:
        - $ref: "#/components/parameters/path_project_3c749d5b"
        - $ref: "#/components/parameters/path_disk"
        - $ref: "#/components/parameters/query_purge"
        - $ref: "#/components/parameters/header_Idempotency-Key"
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Успешный ответ (пустое тело ответа)
        default:
          description: Допустимые HTTP-коды ошибок — 400, 403, 404, 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /compute/v1/projects/{project}/diskBackups:
    get:
      tags:
        - diskBackup
      summary: Получить список резервных копий дисков
      description: |-
        Операция позволяет получить список ресурсов
      
        Поддерживается фильтрация и сортировка с помощью query-параметров `filter` и `orderBy`.
        Информация по использованию этих параметров находится в их описании
      
        Поля, по которым можно фильтровать (`filter`):
          - `metadata.id.name`
          - `metadata.displayName`
          - `status.ready.state`
          - `status.storageSize`
      
        Поля, по которым можно сортировать (`orderBy`):
          - `metadata.id.name`
          - `metadata.createTime`
          - `metadata.displayName`
          - `status.ready.state`
          - `status.storageSize`
      operationId: ListDiskBackups
      parameters:
        - $ref: "#/components/parameters/path_project_3c749d5b"
        - $ref: "#/components/parameters/query_pageSize"
        - $ref: "#/components/parameters/query_pageToken"
        - $ref: "#/components/parameters/query_filter"
        - $ref: "#/components/parameters/query_orderBy"
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DiskBackupResponse'
                  nextPageToken:
                    $ref: '#/components/schemas/NextPageToken'
                    description: Строка, которую нужно передать в следующем запросе, чтобы получить следующую страницу. Для последней страницы не задан
                required:
                  - items
        default:
          description: Допустимые HTTP-коды ошибок — 403, 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /compute/v1/projects/{project}/diskBackups/{diskBackup}:
    post:
      tags:
        - diskBackup
      summary: Создать или изменить резервную копию диска
      description: |-
        Метод создает новый ресурс или обновляет существующий.
        Поддерживается частичное обновление ресурса
      
        Поля, переданные в запросе, объединяются с уже существующими полями по следующим правилам:
          - текущие значения заменяются на новые, переданные в запросе;
          - если для поля в запросе передается значение `null`, его текущее значение удаляется. Актуально только для опциональных полей, которые могут иметь значение `null`;
          - простые коллекции полностью перезаписывают существующие;
          - сложные коллекции объединяются рекурсивно:
            - элементы идентифицируются по обязательному уникальному атрибуту `name`;
            - если элементу соответствует элемент в запросе, он обновляется по тем же правилам, что и весь ресурс;
            - если элемент присутствует в текущем описании ресурса, но отсутствует в запросе, он удаляется;
            - если элемент присутствует в запросе, но отсутствует в текущем описании ресурса, он создается;
            - порядок элементов становится таким же, как в запросе.
      
        Тип коллекции указывается в описании соответствующего поля
      
        Чтобы предотвратить конфликты при конкурентном обновлении ресурса, в запросе нужно передать поле `metadata.etag`.
        Значение `ETag` вычисляется и возвращается сервисом при каждом обновлении состояния ресурса.
        Если в момент отправки запроса `ETag` изменился на стороне сервиса, в ответе возвращается ошибка `INVALID_ETAG_KEY`.
      operationId: UpsertDiskBackup
      parameters:
        - $ref: "#/components/parameters/path_project_3c749d5b"
        - $ref: "#/components/parameters/path_diskBackup"
        - $ref: "#/components/parameters/query_createOnly"
        - $ref: "#/components/parameters/query_updateOnly"
        - $ref: "#/components/parameters/header_Idempotency-Key"
      security:
        - BearerAuth: []
      requestBody:
        description: Данные для обновления резервной копии диска
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiskBackupRequest'
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskBackupResponse'
        default:
          description: Допустимые HTTP-коды ошибок — 400, 403, 409, 412, 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      tags:
        - diskBackup
      summary: Получить информацию о резервной копии диска
      operationId: GetDiskBackup
      parameters:
        - $ref: "#/components/parameters/path_project_3c749d5b"
        - $ref: "#/components/parameters/path_diskBackup"
        - $ref: "#/components/parameters/query_waitNew"
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskBackupResponse'
        default:
          description: Допустимые HTTP-коды ошибок — 400, 403, 404, 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags:
        - diskBackup
      summary: Удалить резервную копию диска
      operationId: DeleteDiskBackup
      parameters:
        - $ref: "#/components/parameters/path_project_3c749d5b"
        - $ref: "#/components/parameters/path_diskBackup"
        - $ref: "#/components/parameters/query_purge"
        - $ref: "#/components/parameters/header_Idempotency-Key"
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Успешный ответ (пустое тело ответа)
        default:
          description: Допустимые HTTP-коды ошибок — 400, 403, 404, 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /compute/v1/projects/{project}/virtualMachines/{virtualMachine}:getSerialPortOutput:
    get:
      tags:
        - serialPort
      summary: Get serial console output from virtual machine
      operationId: GetComputeSerialPortOutput
      parameters:

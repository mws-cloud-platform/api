      type: object
      description: Набор общих для всех пользовательских объектов атрибутов. Может быть расширен атрибутами, специфичными для контейнеров
      properties:
        displayName:
          type: string
          description: Отображаемое имя. Необязательное поле, можно свободно задавать и изменять для удобства организации ресурсов
        etag:
          type: string
          description: Идентификатор состояния ресурса, позволяет отслеживать изменение ресурса
        description:
          type: string
          description: Описание ресурса

    KafkaClusterSpecRequest:
      type: object
      description: Параметры кластера
      properties:
        active:
          type: boolean
          description: Состояние кластера — включен или выключен
          default: true
        version:
          type: string
          description: |-
            Версия продукта
          
            Обязательно для заполнения при создании ресурса
        region:
          type: string
          description: |-
            Регион, которому принадлежит кластер
          
            Строка в форматах:
              Полный формат:
                - "rm/regions/{region}"
              Сокращенные форматы:
                - "regions/{region}"
                - "{region}"
          
            Полный формат всегда корректен.
            Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
          
            Неизменяемое поле. Задается только при создании ресурса.
            При обновлении ресурса можно передать только текущее значение
          
            Примеры:
              - "rm/regions/myRegion"
              - "regions/myRegion"
              - "myRegion"
        endpoints:
          type: array
          description: |-
            Описание эндпойнтов в сетях пользователя (VPC) для подключения к брокерам кластера
          
            Простая коллекция. При обновлении ресурса простая коллекция, переданная в запросе, полностью заменяет существующую. Подробнее см. в описании метода `Upsert`
          
            Обязательно для заполнения при создании ресурса
          items:
            $ref: '#/components/schemas/KafkaEndpointRequest'
        instances:
          $ref: '#/components/schemas/KafkaInstanceRequest'
          description: |-
            Описание ресурсов хостов брокеров и контроллеров
          
            Обязательно для заполнения при создании ресурса
        productConfig:
          type: string
          description: Настройки Kafka. Если не указаны, будут использованы настройки по умолчанию
        maintenanceWindow:
          allOf:
            - $ref: '#/components/schemas/MaintenanceWindowRequest'
          nullable: true
        schemaRegistry:
          allOf:
            - $ref: '#/components/schemas/KafkaSchemaRegistrySpecRequest'
          description: Настройка Schema Registry для кластера
          nullable: true
        balancer:
          allOf:
            - $ref: '#/components/schemas/KafkaBalancerSpecRequest'
          description: Настройка балансировщика кластера
          nullable: true

    KafkaEndpointRequest:
      type: object

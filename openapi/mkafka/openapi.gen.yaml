components:
  schemas:
    KafkaClusterPageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KafkaClusterResponse'
        nextPageToken:
          $ref: '#/components/schemas/NextPageToken'
          description: Строка, которую нужно передать в следующем запросе, чтобы получить следующую страницу. Для последней страницы не задан
      required:
        - items

    KafkaClusterResponse:
      type: object
      description: |-
        Кластер Managed Kafka — это группа узлов (брокеров), объединенных для приема,
        хранения и передачи потоков данных с помощью Apache Kafka. В облачной
        инфраструктуре кластер — единый интерфейс для управления потоками данных в
        реальном времени
      properties:
        kind:
          type: string
          default: mkafka/v1/streaming/kafka
        metadata:
          type: object
          allOf:
            - $ref: '#/components/schemas/TypedResourceMetadataResponse'
            - type: object
              properties:
                id:
                  type: string
                  description: |-
                    Ссылка на типизированный референс
                  
                    Строка в формате: "mkafka/projects/{project}/clusters/{cluster}"
                  
                    Пример: "mkafka/projects/myProject/clusters/myCluster"
          nullable: true
        spec:
          $ref: '#/components/schemas/KafkaClusterSpecResponse'
          description: Параметры кластера
        status:
          allOf:
            - $ref: '#/components/schemas/KafkaClusterStatusResponse'
          nullable: true
      required:
        - spec

    TypedResourceMetadataResponse:
      type: object
      description: Набор общих для всех пользовательских объектов атрибутов. Может быть расширен атрибутами, специфичными для контейнеров
      properties:
        displayName:
          type: string
          description: Отображаемое имя. Необязательное поле, можно свободно задавать и изменять для удобства организации ресурсов
        createTime:
          type: string
          description: Дата создания объекта
          format: date-time
        updateTime:
          type: string
          description: Дата последнего изменения объекта
          format: date-time
        deleteTime:
          type: string
          description: Время запроса на удаление ресурса (не фактическое время удаления)
          format: date-time
        purgeTime:
          type: string
          format: date-time
        usages:
          type: array
          description: Связи с другими ресурсами. В зависимости от типа связи операции над ресурсом могут быть ограничены
          items:
            $ref: '#/components/schemas/TypedUsageResponse'
        etag:
          type: string
          description: Идентификатор состояния ресурса, позволяет отслеживать изменение ресурса
        description:
          type: string
          description: Описание ресурса

    TypedUsageResponse:
      type: object
      properties:
        usageType:
          type: string
          description: Тип связи. Помимо стандартных `own` и `use` могут быть добавлены специализированные типы для конкретных сервисов
        resource:
          type: string
          description: |-
            Ссылка на ресурс
          
            Строка в формате: "servicename/foos/{foo}/bars/{bar}"
          
            Пример: "servicename/foos/myFoo/bars/myBar"
      required:
        - usageType
        - resource

    KafkaClusterSpecResponse:
      type: object
      description: Параметры кластера
      properties:
        active:
          type: boolean
          description: Состояние кластера — включен или выключен
          default: true
        version:
          type: string
          description: Версия продукта
        region:
          type: string
          description: |-
            Регион, которому принадлежит кластер
          
            Строка в форматах:
              Полный формат:
                - "rm/regions/{region}"
              Сокращенные форматы:
                - "regions/{region}"
                - "{region}"
          
            Полный формат всегда корректен.
            Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
          
            Неизменяемое поле. Задается только при создании ресурса.
            При обновлении ресурса можно передать только текущее значение
          
            Примеры:
              - "rm/regions/myRegion"
              - "regions/myRegion"
              - "myRegion"
        endpoints:
          type: array
          description: Описание эндпойнтов в сетях пользователя (VPC) для подключения к брокерам кластера
          items:
            $ref: '#/components/schemas/KafkaEndpointResponse'
        instances:
          $ref: '#/components/schemas/KafkaInstanceResponse'
          description: Описание ресурсов хостов брокеров и контроллеров
        productConfig:
          type: string
          description: Настройки Kafka. Если не указаны, будут использованы настройки по умолчанию
        maintenanceWindow:
          allOf:
            - $ref: '#/components/schemas/MaintenanceWindowResponse'
          nullable: true
        schemaRegistry:
          allOf:
            - $ref: '#/components/schemas/KafkaSchemaRegistrySpecResponse'
          description: Настройка Schema Registry для кластера
          nullable: true
        balancer:
          allOf:
            - $ref: '#/components/schemas/KafkaBalancerSpecResponse'
          description: Настройка балансировщика кластера
          nullable: true
      required:
        - version
        - endpoints
        - instances

    KafkaEndpointResponse:
      type: object
      description: Описание эндпойнтов в пользовательской сети (VPC) для подключения к брокерам кластера
      properties:
        name:
          type: string
          description: Имя эндпойнта
        network:
          type: string
          description: |-
            Идентификатор пользовательской сети (VPC)
          
            Строка в форматах:
              Полный формат:
                - "vpc/projects/{project}/networks/{network}"
              Сокращенные форматы:
                - "projects/{project}/networks/{network}"
                - "networks/{network}"
                - "{network}"
          
            Полный формат всегда корректен.
            Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
          
            Примеры:
              - "vpc/projects/myProject/networks/myNetwork"
              - "projects/myProject/networks/myNetwork"
              - "networks/myNetwork"
              - "myNetwork"
        brokerAddresses:
          type: array
          description: Список адресов в пользовательской сети, на которые "отображаются" брокеры
          items:
            $ref: '#/components/schemas/KafkaEndpointBrokerAddressResponse'
        externalAccess:
          allOf:
            - $ref: '#/components/schemas/KafkaEndpointExternalAccessesResponse'
          description: Настройка внешнего доступа к кластеру Kafka
          nullable: true
      required:

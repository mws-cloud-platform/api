        - network
        - brokerAddresses

    KafkaEndpointBrokerAddressResponse:
      type: object
      description: Описание адреса пользовательской сети, назначаемого брокеру. Задается или идентификатор существующего адреса, или спецификация нового
      properties:
        ref:
          type: string
          description: |-
            Идентификатор существующего адреса
          
            Строка в форматах:
              Полный формат:
                - "vpc/projects/{project}/networks/{network}/addresses/{address}"
              Сокращенные форматы:
                - "projects/{project}/networks/{network}/addresses/{address}"
                - "networks/{network}/addresses/{address}"
                - "addresses/{address}"
                - "{address}"
          
            Полный формат всегда корректен.
            Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
          
            Примеры:
              - "vpc/projects/myProject/networks/myNetwork/addresses/myAddress"
              - "projects/myProject/networks/myNetwork/addresses/myAddress"
              - "networks/myNetwork/addresses/myAddress"
              - "addresses/myAddress"
              - "myAddress"
        spec:
          allOf:
            - $ref: '#/components/schemas/KafkaEndpointBrokerAddressSpecResponse'
          description: Спецификация нового адреса. Адрес будет выделен в ходе реконсиляции кластера
          nullable: true

    KafkaEndpointBrokerAddressSpecResponse:
      type: object
      description: Спецификация нового адреса. Адрес будет выделен в ходе реконсиляции кластера
      properties:
        subnet:
          type: string
          description: |-
            Идентификатор подсети, в которой необходимо выделить адрес
          
            Строка в форматах:
              Полный формат:
                - "vpc/projects/{project}/networks/{network}/subnets/{subnet}"
              Сокращенные форматы:
                - "projects/{project}/networks/{network}/subnets/{subnet}"
                - "networks/{network}/subnets/{subnet}"
                - "subnets/{subnet}"
                - "{subnet}"
          
            Полный формат всегда корректен.
            Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
          
            Примеры:
              - "vpc/projects/myProject/networks/myNetwork/subnets/mySubnet"
              - "projects/myProject/networks/myNetwork/subnets/mySubnet"
              - "networks/myNetwork/subnets/mySubnet"
              - "subnets/mySubnet"
              - "mySubnet"
      required:
        - subnet

    KafkaEndpointExternalAccessesResponse:
      type: object
      description: Настройка внешнего доступа к кластеру Kafka
      properties:
        allowed:
          type: boolean
          description: Назначить внешние адреса для кластера Kafka
        brokerAddresses:
          type: array
          description: Список внешних адресов, используемых для настройки доступа к кластеру Kafka. Если флаг `allowed` установлен в true и адреса не указаны, внешние адреса будут выделены автоматически
          items:
            $ref: '#/components/schemas/KafkaEndpointExternalAddressSpecOrRefResponse'
      required:
        - allowed

    KafkaEndpointExternalAddressSpecOrRefResponse:
      type: object
      description: Внешний адрес брокера. Задается или идентификатор существующего адреса, или спецификация нового
      properties:
        ref:
          type: string
          description: |-
            Идентификатор существующего внешнего адреса
          
            Строка в форматах:
              Полный формат:
                - "vpc/projects/{project}/externalAddresses/{externalAddress}"
              Сокращенные форматы:
                - "projects/{project}/externalAddresses/{externalAddress}"
                - "externalAddresses/{externalAddress}"
                - "{externalAddress}"
          
            Полный формат всегда корректен.
            Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
          
            Примеры:
              - "vpc/projects/myProject/externalAddresses/myExternalAddress"
              - "projects/myProject/externalAddresses/myExternalAddress"
              - "externalAddresses/myExternalAddress"
              - "myExternalAddress"
        spec:
          type: object
          description: Спецификация нового внешнего адреса. Адрес будет выделен в ходе реконсиляции кластера
          nullable: true

    KafkaInstanceResponse:
      type: object
      description: Описание ресурсов хостов брокеров и контроллеров
      properties:
        broker:
          $ref: '#/components/schemas/KafkaInstanceSpecResponse'
          description: Параметры виртуальной машины, где будет работать брокер Кафки
        controller:
          $ref: '#/components/schemas/KafkaControllerInstanceSpecResponse'
          description: Параметры виртуальной машины, где будет работать KRaft контроллер Кафки
      required:
        - broker
        - controller

    KafkaInstanceSpecResponse:
      type: object
      description: Параметры виртуальной машины, где будет работать брокер Кафки
      properties:
        vmType:
          type: string
          description: |-
            Тип виртуальной машины, описывающий ресурсы (vCPU, memory)
          
            Строка в форматах:
              Полный формат:
                - "compute/vmTypes/{vmType}"
              Сокращенные форматы:
                - "vmTypes/{vmType}"
                - "{vmType}"
          
            Полный формат всегда корректен.
            Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
          
            Примеры:
              - "compute/vmTypes/myVmType"
              - "vmTypes/myVmType"
              - "myVmType"
        disk:
          $ref: '#/components/schemas/KafkaDataDiskSpecResponse'
          description: Параметры диска с данными на узле кластера
        allocation:
          type: array
          description: Параметры размещения брокеров по зонам
          items:
            $ref: '#/components/schemas/KafkaAllocationResponse'
      required:
        - vmType
        - disk

    KafkaDataDiskSpecResponse:
      type: object
      description: Параметры диска с данными на узле кластера
      properties:
        size:
          type: string
          description: |-
            Размер диска
          
            Размер в байтах. Формат: <число> [единица измерения].
            Допустимые единицы измерения: `B`, `KB`, `MB`, `GB`, `TB`, `PB`, `EB`, `ZB`, `YB`, `RB`, `QB`. По умолчанию: `B`.
            Допустимые значения — положительные целые числа и дробные числа с ненулевой целой частью.
            Значение базовой единицы измерения (в байтах) должно оставаться целым.
            Регистр и лишние пробелы перед строкой, после строки и между ее частями игнорируются
          
            Примеры:
              - "1"
              - "1 B"
              - "1024 kb"
              - "1.5 TB"
        type:
          $ref: '#/components/schemas/KafkaDataDiskType'
          description: |-
            Тип используемого диска:
            * `NETWORK_STANDARD_SSD` — сетевой SSD
        iops:
          $ref: '#/components/schemas/KafkaDataDiskIops'
          description: Количество дисковых операций в секунду
      required:
        - size

    KafkaDataDiskType:
      type: string
      description: |-
        Тип используемого диска:
        * `NETWORK_STANDARD_SSD` — сетевой SSD
      enum:
        - "NETWORK_STANDARD_SSD"
      default: NETWORK_STANDARD_SSD

    KafkaDataDiskIops:
      type: integer
      description: Количество дисковых операций в секунду
      format: int32

    KafkaAllocationResponse:
      type: object
      description: Конфигурация (размещение) узлов кластера по зонам
      properties:
        zone:
          type: string
          description: |-
            Зона расположения узла
          
            Строка в форматах:
              Полный формат:
                - "rm/zones/{zone}"
              Сокращенные форматы:
                - "zones/{zone}"
                - "{zone}"
          
            Полный формат всегда корректен.
            Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
          
            Примеры:
              - "rm/zones/myZone"
              - "zones/myZone"
              - "myZone"
        count:
          type: integer
          description: Количество брокеров в зоне/подсети
          format: int32
      required:
        - zone
        - count

    KafkaControllerInstanceSpecResponse:
      type: object
      description: Параметры виртуальной машины, где будет работать KRaft контроллер Кафки
      properties:
        combinedWithBroker:
          type: boolean
          description: |-
            Размещать контроллеры на тех же виртуальных машинах, что и брокеры
          
            Неизменяемое поле. Задается только при создании ресурса.
            При обновлении ресурса можно передать только текущее значение
        vmType:
          type: string
          description: |-
            Тип виртуальной машины, описывающий ресурсы (vCPU, memory)
          
            Строка в форматах:
              Полный формат:
                - "compute/vmTypes/{vmType}"
              Сокращенные форматы:
                - "vmTypes/{vmType}"
                - "{vmType}"
          
            Полный формат всегда корректен.
            Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
          
            Примеры:
              - "compute/vmTypes/myVmType"
              - "vmTypes/myVmType"
              - "myVmType"
        disk:
          allOf:
            - $ref: '#/components/schemas/KafkaDataDiskSpecResponse'
          description: Параметры диска с данными на узле кластера
          nullable: true
        allocation:
          type: array
          description: Параметры размещения контроллеров по зонам
          items:
            $ref: '#/components/schemas/KafkaAllocationResponse'

    MaintenanceWindowResponse:
      type: object
      properties:
        weekly:
          $ref: '#/components/schemas/WeeklyMaintenanceWindowResponse'
      required:
        - weekly

    WeeklyMaintenanceWindowResponse:
      type: object
      properties:
        days:
          type: array
          description: Дни недели, в которые будет запущено задание на тех. обслуживание
          items:
            $ref: '#/components/schemas/DayOfWeek'
        hour:
          type: integer
          description: Час, в который будет запущено задание на тех. обслуживание
        duration:
          type: string
          description: |-
            Допустимая продолжительность процесса обновления. Если не указано, то не ограничено по времени. Принимается только формат в часах (h)
          
            Поддерживаются следующие форматы:
              - ISO 8601: P(n)DT(n)H(n)M(n)S. Допустимые единицы измерения: дни (`D`), часы (`H`), минуты (`M`), секунды (`S`). Только секунды могут быть дробными
              - Простой формат. Допустимые единицы измерения: `d`, `h`, `m`, `s`, `ms`, `us`, `ns`.
                Величины должны следовать по убыванию единиц измерения
              - Число в секундах
          
            Отрицательные значения обозначаются префиксом "-", в простом формате могут быть ограничены скобками.
            Регистр и пробелы игнорируются
          
            Примеры:
              - "PT1S"
              - "-PT4.2S"
              - "P1DT2H3M4S"
              - "42s"
              - "1h10m42s"
              - "-(1d 2h 3m 4s 5ms 6us 7ns)"
              - "42"
          nullable: true
      required:
        - days
        - hour

    DayOfWeek:
      type: string
      description: День недели
      enum:
        - "MONDAY"
        - "TUESDAY"
        - "WEDNESDAY"
        - "THURSDAY"
        - "FRIDAY"
        - "SATURDAY"
        - "SUNDAY"


        weekly:
          $ref: '#/components/schemas/WeeklyMaintenanceWindowRequest'
          description: Обязательно для заполнения при создании ресурса

    WeeklyMaintenanceWindowRequest:
      type: object
      properties:
        days:
          type: array
          description: |-
            Дни недели, в которые будет запущено задание на тех. обслуживание
          
            Простая коллекция. При обновлении ресурса простая коллекция, переданная в запросе, полностью заменяет существующую. Подробнее см. в описании метода `Upsert`
          
            Обязательно для заполнения при создании ресурса
          items:
            $ref: '#/components/schemas/DayOfWeek'
        hour:
          type: integer
          description: |-
            Час, в который будет запущено задание на тех. обслуживание
          
            Обязательно для заполнения при создании ресурса
        duration:
          type: string
          description: |-
            Допустимая продолжительность процесса обновления. Если не указано, то не ограничено по времени. Принимается только формат в часах (h)
          
            Поддерживаются следующие форматы:
              - ISO 8601: P(n)DT(n)H(n)M(n)S. Допустимые единицы измерения: дни (`D`), часы (`H`), минуты (`M`), секунды (`S`). Только секунды могут быть дробными
              - Простой формат. Допустимые единицы измерения: `d`, `h`, `m`, `s`, `ms`, `us`, `ns`.
                Величины должны следовать по убыванию единиц измерения
              - Число в секундах
          
            Отрицательные значения обозначаются префиксом "-", в простом формате могут быть ограничены скобками.
            Регистр и пробелы игнорируются
          
            Примеры:
              - "PT1S"
              - "-PT4.2S"
              - "P1DT2H3M4S"
              - "42s"
              - "1h10m42s"
              - "-(1d 2h 3m 4s 5ms 6us 7ns)"
              - "42"
          nullable: true

    KafkaSchemaRegistrySpecRequest:
      type: object
      description: Настройка Schema Registry для кластера
      properties:
        enabled:
          type: boolean
          description: Включить Schema Registry в кластере

    KafkaBalancerSpecRequest:
      type: object
      description: Настройка балансировщика кластера
      properties:
        enabled:
          type: boolean
          description: Состояние балансировщика — включен или выключен
        autoRebalance:
          type: boolean
          description: Если включено - запускать автоматическую ребалансировку во время сервисного окна

    KafkaUserPageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KafkaUserResponse'
        nextPageToken:
          $ref: '#/components/schemas/NextPageToken'
          description: Строка, которую нужно передать в следующем запросе, чтобы получить следующую страницу. Для последней страницы не задан
      required:
        - items

    KafkaUserResponse:
      type: object
      description: Пользователь — это внутренняя учетная запись Kafka для аутентификации в кластере
      properties:
        kind:
          type: string
          default: mkafka/v1/streaming/kafka/users
        metadata:
          type: object
          allOf:
            - $ref: '#/components/schemas/TypedResourceMetadataResponse'
            - type: object
              properties:
                id:
                  type: string
                  description: |-
                    Ссылка на типизированный референс
                  
                    Строка в формате: "mkafka/projects/{project}/clusters/{cluster}/users/{user}"
                  
                    Пример: "mkafka/projects/myProject/clusters/myCluster/users/myUser"
          nullable: true
        spec:
          $ref: '#/components/schemas/KafkaUserSpecResponse'
          description: Параметры пользователя
        status:
          allOf:
            - $ref: '#/components/schemas/KafkaUserStatusResponse'
          nullable: true
      required:
        - spec

    KafkaUserSpecResponse:
      type: object
      description: Параметры пользователя
      properties:
        roles:
          type: array
          description: Роли пользователя
          items:
            $ref: '#/components/schemas/KafkaClusterRoleResponse'
      required:
        - roles

    KafkaClusterRoleResponse:
      type: object
      description: Роль пользователя в кластере
      properties:
        name:
          $ref: '#/components/schemas/KafkaClusterRoleName'
          description: Название роли
      required:
        - name

    KafkaClusterRoleName:
      type: string
      description: Название роли
      enum:
        - "CLUSTER_ADMIN"
        - "PRODUCER"
        - "CONSUMER"
        - "SCHEMA_REGISTRY_ADMIN"
        - "SCHEMA_REGISTRY_WRITER"
        - "SCHEMA_REGISTRY_READER"

    KafkaUserStatusResponse:
      $ref: '#/components/schemas/ResourceStatusResponse'

    KafkaUserRequest:
      type: object
      description: Пользователь — это внутренняя учетная запись Kafka для аутентификации в кластере
      properties:
        metadata:
          type: object
          allOf:
            - $ref: '#/components/schemas/TypedResourceMetadataRequest'
          nullable: true
        spec:
          $ref: '#/components/schemas/KafkaUserSpecRequest'
          description: |-
            Параметры пользователя
          
            Обязательно для заполнения при создании ресурса

    KafkaUserSpecRequest:
      type: object
      description: Параметры пользователя
      properties:
        password:
          type: string
          description: |-
            Пароль пользователя
          
            Поле содержит чувствительные данные. Ограничьте доступ к ним
          
            Обязательно для заполнения при создании ресурса
        roles:
          type: array
          description: |-
            Роли пользователя
          
            Простая коллекция. При обновлении ресурса простая коллекция, переданная в запросе, полностью заменяет существующую. Подробнее см. в описании метода `Upsert`
          
            Обязательно для заполнения при создании ресурса
          items:
            $ref: '#/components/schemas/KafkaClusterRoleRequest'

    KafkaClusterRoleRequest:
      type: object
      description: Роль пользователя в кластере
      properties:
        name:
          $ref: '#/components/schemas/KafkaClusterRoleName'
          description: |-
            Название роли
          
            Обязательно для заполнения при создании ресурса

    KafkaTopicPageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KafkaTopicResponse'
        nextPageToken:
          $ref: '#/components/schemas/NextPageToken'
          description: Строка, которую нужно передать в следующем запросе, чтобы получить следующую страницу. Для последней страницы не задан
      required:
        - items

    KafkaTopicResponse:
      type: object
      description: |-
        Топик — это логический поток сообщений, который создается пользователем в
        кластере и обеспечивает группировку сообщений по темам
      properties:
        kind:
          type: string
          default: mkafka/v1/streaming/kafkaTopic
        metadata:
          type: object
          allOf:
            - $ref: '#/components/schemas/TypedResourceMetadataResponse'
            - type: object
              properties:
                id:
                  type: string
                  description: |-
                    Ссылка на типизированный референс
                  
                    Строка в формате: "mkafka/projects/{project}/clusters/{cluster}/topics/{topic}"
                  
                    Пример: "mkafka/projects/myProject/clusters/myCluster/topics/myTopic"
          nullable: true
        spec:
          $ref: '#/components/schemas/KafkaTopicSpecResponse'
          description: Параметры топика
        status:
          allOf:
            - $ref: '#/components/schemas/KafkaTopicStatusResponse'
          nullable: true
      required:
        - spec

    KafkaTopicSpecResponse:
      type: object
      description: Параметры топика
      properties:
        partitions:
          type: integer
          description: Количество партиций
          format: int32
          default: -1
        replicationFactor:
          type: integer
          description: Фактор репликации
          format: int32
          default: -1
        config:
          type: string
          description: Дополнительные параметры

    KafkaTopicStatusResponse:
      $ref: '#/components/schemas/ResourceStatusResponse'

    KafkaTopicRequest:
      type: object
      description: |-
        Топик — это логический поток сообщений, который создается пользователем в
        кластере и обеспечивает группировку сообщений по темам
      properties:
        metadata:
          type: object
          allOf:
            - $ref: '#/components/schemas/TypedResourceMetadataRequest'
          nullable: true
        spec:
          $ref: '#/components/schemas/KafkaTopicSpecRequest'
          description: |-
            Параметры топика
          
            Обязательно для заполнения при создании ресурса

    KafkaTopicSpecRequest:
      type: object
      description: Параметры топика
      properties:
        partitions:
          type: integer
          description: Количество партиций
          format: int32
          default: -1
        replicationFactor:
          type: integer
          description: Фактор репликации
          format: int32
          default: -1
        config:
          type: string
          description: Дополнительные параметры

    ApiError:
      type: object
      description: Описание ошибки (если HTTP-статус отличен от 2xx)
      properties:
        code:
          type: string
          description: Короткий код ошибки
          enum:
            - "ALREADY_EXISTS"
            - "CANCELLED"
            - "DEADLINE_EXCEEDED"
            - "FAILED_PRECONDITION"
            - "INTERNAL"
            - "INVALID_ARGUMENT"
            - "NOT_FOUND"
            - "PERMISSION_DENIED"
            - "QUOTA_EXCEEDED"
            - "IDEMPOTENCY_KEY_ALREADY_USED"
            - "INVALID_ETAG_KEY"
            - "UNAUTHENTICATED"
            - "UNAVAILABLE"
            - "METHOD_NOT_ALLOWED"
            - "TOO_MANY_REQUESTS"
        type:
          type: string
          description: Подтип расширенной информации по ошибкам к которому удалось его привести. Null если привели к базовому типу
        description:
          type: string
          description: Развёрнутое пояснение ошибки
        retryPolicy:
          allOf:
            - $ref: '#/components/schemas/RetryPolicy'
          description: Правила выполнения повторных попыток в случае ошибки
          nullable: true
        details:
          type: object
          description: |-
            Детальная информация по ошибке в произвольном JSON формате. Содержимое не предназначено для машинной обработки
          
            Примеры:
              - '{"jsonPaths": [{"path": "foo.bar", "reason": "some reason", "offset": "line: 1, column: 2"}]}'
              - '{"errorInfo": "some error info"}'
          additionalProperties: true
      required:
        - code

    RetryPolicy:
      type: object
      description: Правила выполнения повторных попыток в случае ошибки
      properties:
        retryCount:
          type: integer
          description: Максимальное количество повторных попыток. 0 - значение по-умолчанию
        retryTimeout:
          type: string
          description: |-
            Пауза между повторными попытками
          
            Поддерживаются следующие форматы:
              - ISO 8601: P(n)DT(n)H(n)M(n)S. Допустимые единицы измерения: дни (`D`), часы (`H`), минуты (`M`), секунды (`S`). Только секунды могут быть дробными
              - Простой формат. Допустимые единицы измерения: `d`, `h`, `m`, `s`, `ms`, `us`, `ns`.
                Величины должны следовать по убыванию единиц измерения
              - Число в секундах
          
            Отрицательные значения обозначаются префиксом "-", в простом формате могут быть ограничены скобками.
            Регистр и пробелы игнорируются
          
            Примеры:
              - "PT1S"
              - "-PT4.2S"
              - "P1DT2H3M4S"
              - "42s"
              - "1h10m42s"
              - "-(1d 2h 3m 4s 5ms 6us 7ns)"
              - "42"
        retryTimeoutScale:
          $ref: '#/components/schemas/RetryTimeoutScale'
          description: Шаг увеличения таймаута
        maxRetryTimeout:
          type: string
          description: |-
            Максимальная длительность таймаута
          
            Поддерживаются следующие форматы:
              - ISO 8601: P(n)DT(n)H(n)M(n)S. Допустимые единицы измерения: дни (`D`), часы (`H`), минуты (`M`), секунды (`S`). Только секунды могут быть дробными
              - Простой формат. Допустимые единицы измерения: `d`, `h`, `m`, `s`, `ms`, `us`, `ns`.
                Величины должны следовать по убыванию единиц измерения
              - Число в секундах
          
            Отрицательные значения обозначаются префиксом "-", в простом формате могут быть ограничены скобками.
            Регистр и пробелы игнорируются
          
            Примеры:
              - "PT1S"
              - "-PT4.2S"
              - "P1DT2H3M4S"
              - "42s"
              - "1h10m42s"
              - "-(1d 2h 3m 4s 5ms 6us 7ns)"
              - "42"
      required:
        - retryCount
        - retryTimeout

    RetryTimeoutScale:
      type: string
      description: Шаг увеличения таймаута
      enum:
        - "FIXED"
        - "LINEAR"
        - "PROGRESSIVE"
        - "EXPONENTIAL"

  securitySchemes:
    BearerAuth:
      description: Токен авторизации IAM
      type: apiKey
      in: header
      name: Authorization

  parameters:
    header_Idempotency-Key:
      name: Idempotency-Key
      in: header
      description: Ключ идемпотентности
      style: simple
      schema:
        type: string

    path_cluster:
      name: cluster
      in: path
      required: true
      description: Название или идентификатор кластера.
      style: simple
      schema:
        type: string
        pattern: ^[a-z]([a-z0-9-]{0,25}[a-z0-9])?$

    path_project:
      name: project
      in: path
      required: true
      description: Путь к проекту.
      style: simple
      schema:
        type: string

    path_topic:
      name: topic
      in: path
      required: true
      description: Название топика.
      style: simple
      schema:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{1,248}$

    path_user:
      name: user
      in: path
      required: true
      description: Пользователь кластера.
      style: simple
      schema:
        type: string
        pattern: ^(?!(mkafka-monitor|mws-controller-admin|mws-cluster-admin)$)[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$

    query_createOnly:
      name: createOnly
      in: query
      description: Создать ресурс. Если ресурс уже существует, будет возвращен ответ `AlreadyExists`
      style: form
      explode: true
      schema:
        type: boolean

    query_filter:
      name: filter
      in: query
      description: |-
        Строка фильтра.
        Для фильтрации используется ограниченная реализация AIP-160 (https://google.aip.dev/160).
        Она включает в себя операции =, !=, OR, AND и (), фильтрацию свойств вложенных объектов и wildcard-поиск подстрок
      style: form
      explode: true
      schema:
        type: string

    query_orderBy:
      name: orderBy
      in: query
      description: |-
        Строка сортировки.
        Для сортировки используется реализация AIP-132 (https://google.aip.dev/132#ordering).
        Указывается перечислением полей с направлением сортировки (asc, desc) через запятую.
        По умолчанию используется сортировка по возрастанию (asc)
      style: form
      explode: true
      schema:
        type: string

    query_pageSize:
      name: pageSize
      in: query
      description: Максимальное количество объектов, которые клиент готов принять. Сервис определяет значение по умолчанию и верхнюю границу
      style: form
      explode: true
      schema:
        type: integer

    query_pageToken:
      name: pageToken
      in: query
      description: Строка, из предыдущего ответа на аналогичный запрос, для получения следующей страницы с объектами. Не задано для получения первой страницы
      style: form
      explode: true
      schema:
        type: string

    query_purge:
      name: purge
      in: query
      description: Удалить ресурс без возможности восстановления
      style: form
      explode: true
      schema:
        type: boolean

    query_showDeleted:
      name: showDeleted
      in: query
      description: Вывод удаленных объектов для ресурсов, поддерживающих soft delete
      style: form
      explode: true
      schema:
        type: string

    query_updateOnly:
      name: updateOnly
      in: query
      description: |-
        Обновить ресурс, если он существует. Если ресурс не существует, будет возвращен ответ `Not Found`.
        Если прав на выполнение операции недостаточно, будет возвращен ответ `PermissionDenied`
      style: form
      explode: true
      schema:
        type: boolean


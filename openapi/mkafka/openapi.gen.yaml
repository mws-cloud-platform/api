      type: object
      description: Настройка балансировщика кластера
      properties:
        enabled:
          type: boolean
          description: Состояние балансировщика — включен или выключен
        autoRebalance:
          type: boolean
          description: Если включено - запускать автоматическую ребалансировку во время сервисного окна

    KafkaClusterStatusResponse:
      type: object
      allOf:
        - $ref: '#/components/schemas/ResourceStatusResponse'
        - type: object
          properties:
            state:
              $ref: '#/components/schemas/ClusterState'
              description: |-
                Состояние кластера:
                  * `CREATING`     - Создаётся;
                  * `RUNNING`      - Работает в штатном режиме;
                  * `STOPPING`     - Останавливается;
                  * `STOPPED`      - Остановлен;
                  * `STARTING`     - Запуск ранее остановленного;
                  * `UPDATING`     - Выполняется обновление;
                  * `ERROR`        - Произошла ошибка, требуется участие команды поддержки;
                  * `DELETING`     - Удаляется;
                  * `DELETED`      - Удалён;
                  * `UNIDENTIFIED` - Не удаётся определить статус;
                  * `RESTORING`    - Восстанавливается
            health:
              $ref: '#/components/schemas/ClusterHealth'
              description: |-
                Работоспособность кластера:
                  * `ALIVE`    - Полностью работоспособен;
                  * `DEGRADED` - Деградирует (некоторые, но не все, экземпляры неработоспособны);
                  * `FAILED`   - Неработоспособен;
                  * `UNKNOWN`  - Не удаётся определить состояние (на этапе создания)
            message:
              type: string
            region:
              type: string
              description: |-
                Регион, которому принадлежит кластер
              
                Строка в формате: "rm/regions/{region}"
              
                Пример: "rm/regions/myRegion"
            effectiveKafkaConfig:
              type: object
              description: Конфигурация параметров кластера после валидации и преобразования из пользователского ввода
              additionalProperties:
                type: string
            instances:
              allOf:
                - $ref: '#/components/schemas/KafkaInstancesStatusResponse'
              description: Описание ресурсов хостов брокеров и контроллеров
              nullable: true
            endpoints:
              type: array
              description: Описание эндпойнтов в сетях пользователя (VPC) для подключения к брокерам кластера
              items:
                $ref: '#/components/schemas/KafkaEndpointStatusResponse'
            maintenanceWindow:
              allOf:
                - $ref: '#/components/schemas/MaintenanceWindow2Response'
              nullable: true
            schemaRegistry:
              allOf:
                - $ref: '#/components/schemas/KafkaSchemaRegistrySpecResponse'
              description: Настройка Schema Registry для кластера
              nullable: true
            balancer:
              allOf:
                - $ref: '#/components/schemas/KafkaBalancerSpecResponse'
              description: Настройка балансировщика кластера
              nullable: true


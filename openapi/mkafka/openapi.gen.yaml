        хранения и передачи потоков данных с помощью Apache Kafka. В облачной
        инфраструктуре кластер — единый интерфейс для управления потоками данных в
        реальном времени
      properties:
        metadata:
          $ref: '#/components/schemas/TypedResourceMetadataRequest'

          type: object
          description: Политика использования версии ключа. Определяет, разрешены ли криптографические операции с этой версией
          properties:
            enabled:
              type: boolean
              description: |-
                Флаг, указывающий, разрешены ли криптографические операции с этой версией ключа.
                Если значение установлено в `false`, все операции шифрования, расшифровки и другие
                криптографические операции с этой версией ключа будут заблокированы
              default: true
          nullable: true

    CryptoKeyVersionStatusResponse:
      type: object
      allOf:
        - $ref: '#/components/schemas/ResourceStatusResponse'
        - type: object
          properties:
            version:
              type: integer
              description: Порядковый номер ключа. Каждый раз при создании новой версии ключа это значение увеличивается
              format: int32
              example: 3
            algorithm:
              type: string
              description: Криптографический алгоритм
              example: AES_256_GCM
            primary:
              type: boolean
              description: |-
                Флаг, указывающий, является ли данная версия криптографического ключа основной.
                Если значение установлено в `true`, эта версия используется по умолчанию
                для всех криптографических операций
            destruction:
              type: object
              description: |-
                Информация о процессе уничтожения версии криптографического ключа.
                Этот раздел присутствует только в том случае, если версия ключа запланирована к уничтожению
                или уже уничтожена
              properties:
                status:
                  type: string
                  description: |-
                    Текущий статус процесса уничтожения версии криптографического ключа.
                    Это поле заполняется только тогда, когда версия ключа находится в одном из статусов уничтожения.
                    Возможные значения:
                    - SCHEDULED_FOR_DESTRUCTION: версия ключа запланирована к уничтожению в будущем
                    - DESTROYED: версия ключа была окончательно уничтожена и не может быть восстановлена
                  enum:
                    - "SCHEDULED_FOR_DESTRUCTION"
                    - "DESTROYED"
                scheduledDestructionTime:
                  type: string
                  description: |-
                    Метка времени, указывающая, когда версия ключа должна быть уничтожена.
                    Если это поле установлено, версия ключа будет автоматически уничтожена в указанное время
                  format: date-time
                  example: 2025-08-01T12:00:00Z
                destroyTime:
                  type: string
                  description: Время уничтожения версии криптографического ключа
                  format: date-time
                  example: 2025-11-01T12:00:00Z
              nullable: true


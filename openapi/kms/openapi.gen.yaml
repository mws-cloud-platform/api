      summary: Возвращает назначенную роль для доступа к ключу KMS
      operationId: GetCryptoKeyRoleBinding
      parameters:
        - $ref: "#/components/parameters/path_project"
        - $ref: "#/components/parameters/path_key"
        - $ref: "#/components/parameters/path_roleBinding"
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoKeyRoleBindingResponse'
        default:
          description: Допустимые HTTP-коды ошибок — 400, 403, 404, 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags:
        - cryptoKeyRoleBinding
      summary: Удалить роль для доступа к ключу KMS
      operationId: DeleteCryptoKeyRoleBinding
      parameters:
        - $ref: "#/components/parameters/path_project"
        - $ref: "#/components/parameters/path_key"
        - $ref: "#/components/parameters/path_roleBinding"
      security:
        - BearerAuth: []
      responses:
        "204":
          description: No Content
        default:
          description: Допустимые HTTP-коды ошибок — 400, 403, 404, 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  schemas:
    CryptoKeyListResponse:
      type: object
      properties:
        items:
          type: array
          description: Список ключей KMS в указанном проекте
          items:
            $ref: '#/components/schemas/CryptoKeyResponse'
        nextPageToken:
          $ref: '#/components/schemas/NextPageToken'
          description: Строка, которую нужно передать в следующем запросе, чтобы получить следующую страницу. Для последней страницы не задан
      required:
        - items

    CryptoKeyResponse:
      type: object
      description: Ключ — ресурс облака, который объединяет несколько экземпляров криптографических ключей, называемых версиями ключа
      properties:
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/CommonTypedResourceMetadataResponse'
          description: Набор общих для всех пользовательских объектов атрибутов. Может быть расширен атрибутами, специфичными для контейнеров
        spec:
          $ref: '#/components/schemas/CryptoKeySpecResponse'
        status:
          $ref: '#/components/schemas/CryptoKeyStatusResponse'
      required:
        - kind
        - metadata
        - spec
        - status

    CommonTypedResourceMetadataResponse:
      type: object
      description: Набор общих для всех пользовательских объектов атрибутов. Может быть расширен атрибутами, специфичными для контейнеров
      properties:
        id:
          type: string
          description: |-
            ID свойства
          
            Строка в формате: "servicename/foos/{foo}/bars/{bar}"
          
            Пример: "servicename/foos/myFoo/bars/myBar"
        displayName:
          type: string
          description: Отображаемое имя свойства
        createTime:
          type: string
          description: Дата создания объекта
          format: date-time
        updateTime:
          type: string
          description: Дата последнего изменения объекта
          format: date-time
        deleteTime:
          type: string
          description: Время запроса на удаление ресурса
          format: date-time
        purgeTime:
          type: string
          description: Время удаления ресурса
          format: date-time
        usages:
          type: array
          description: Связи с другими ресурсами. В зависимости от типа связи операции над ресурсом могут быть ограничены
          items:
            $ref: '#/components/schemas/UsageResponse'
        etag:
          type: string
          description: Идентификатор состояния ресурса, позволяет отслеживать изменение ресурса
        description:
          type: string
          description: Описание ресурса

    UsageResponse:
      type: object
      description: Связь ресурса с другим ресурсом. В зависимости от типа связи операции над ресурсом могут быть ограничены
      properties:
        usageType:
          type: string
          description: Тип связи. Помимо стандартных `own` и `use` могут быть добавлены специализированные типы для конкретных сервисов
        name:
          type: string
          description: Имя связи. Требуется для модификации коллекции
        resource:
          type: string
          description: Ссылка на ресурс
      required:
        - usageType
        - name
        - resource

    CryptoKeySpecResponse:
      type: object
      properties:
        defaultAlgorithm:
          $ref: '#/components/schemas/CryptoKeyAlgorithm'
          description: |-
            Криптографический алгоритм по-умолчанию, используемый для выпуска новых версий ключа.
            Этот алгоритм будет применяться при создании новых версий ключа во время ротации
        destructionPolicy:
          type: object
          description: Политика уничтожения ключа. Определяет параметры и расписание
          properties:
            defaultDestructionIntervalDays:
              type: integer
              description: |-
                Указывает количество дней, по истечении которых ключ будет окончательно уничтожен,
                начиная с момента отправки запроса на удаление.
                Значение можно задать только при создании ключа, и оно не может быть изменено позже.
                Если значение не указано при создании ключа, используется значение по умолчанию (1 день)
              
                Неизменяемое поле. Задается только при создании ресурса.
                При обновлении ресурса можно передать только текущее значение
              format: int32
              default: 1
              example: 7
          nullable: true
        usagePolicy:
          type: object
          description: Политика использования ключа. Определяет, разрешены ли криптографические операции с этим ключом
          properties:
            enabled:
              type: boolean
              description: |-
                Флаг, указывающий, разрешены ли криптографические операции с этим ключом.
                Если значение установлено в `false`, все операции шифрования, расшифровки и другие
                криптографические операции с этим ключом будут заблокированы
              default: true
          nullable: true
        rotationPolicy:
          type: object
          description: Параметры политики, управляющие ротацией криптографического ключа
          properties:
            enabled:
              type: boolean
              description: Флаг, указывающий, включена ли автоматическая ротация для ключа
              default: true
            rotationIntervalDays:
              type: integer
              description: Интервал в днях, через который должна выполняться ротация криптографического ключа
              format: int32
              example: 30
          nullable: true
        primaryKeyVersionRef:
          type: string
          description: |-
            Идентификатор основной версии криптографического ключа.
            Используется только когда автоматическая ротация отключена
          
            Строка в форматах:
              Полный формат:
                - "kms/projects/{project}/cryptoKeys/{key}/cryptoKeyVersions/{version}"
              Сокращенные форматы:
                - "projects/{project}/cryptoKeys/{key}/cryptoKeyVersions/{version}"
                - "cryptoKeys/{key}/cryptoKeyVersions/{version}"
                - "cryptoKeyVersions/{version}"
                - "{version}"
          
            Полный формат всегда корректен.
            Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
          
            Примеры:
              - "kms/projects/myProject/cryptoKeys/myKey/cryptoKeyVersions/myVersion"
              - "projects/myProject/cryptoKeys/myKey/cryptoKeyVersions/myVersion"
              - "cryptoKeys/myKey/cryptoKeyVersions/myVersion"
              - "cryptoKeyVersions/myVersion"
              - "myVersion"
          nullable: true

    CryptoKeyAlgorithm:
      type: string
      enum:
        - "AES_128_GCM"
        - "AES_192_GCM"
        - "AES_256_GCM"
      default: AES_256_GCM

    CryptoKeyStatusResponse:
      type: object
      allOf:
        - $ref: '#/components/schemas/ResourceStatusResponse'
        - type: object
          properties:
            rotation:
              type: object
              properties:
                lastTime:
                  type: string
                  description: Временная метка последней ротации криптографического ключа
                  format: date-time
                  example: 2023-08-01T12:00:00Z
                nextTime:
                  type: string
                  description: Временная метка следующей запланированной ротации криптографического ключа
                  format: date-time
                  example: 2023-09-01T12:00:00Z
                primaryKeyVersionRef:
                  type: string
                  description: |-
                    Идентификатор основной версии криптографического ключа.
                    Это значение представляет номер версии ключа, который в данный момент
                    установлен как основной для криптографических операций
                  
                    Строка в форматах:
                      Полный формат:
                        - "kms/projects/{project}/cryptoKeys/{key}/cryptoKeyVersions/{version}"
                      Сокращенные форматы:
                        - "projects/{project}/cryptoKeys/{key}/cryptoKeyVersions/{version}"
                        - "cryptoKeys/{key}/cryptoKeyVersions/{version}"
                        - "cryptoKeyVersions/{version}"
                        - "{version}"
                  
                    Полный формат всегда корректен.
                    Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
                  
                    Примеры:
                      - "kms/projects/myProject/cryptoKeys/myKey/cryptoKeyVersions/myVersion"
                      - "projects/myProject/cryptoKeys/myKey/cryptoKeyVersions/myVersion"
                      - "cryptoKeys/myKey/cryptoKeyVersions/myVersion"
                      - "cryptoKeyVersions/myVersion"
                      - "myVersion"
              nullable: true
            destruction:
              type: object
              description: |-
                Информация о процессе уничтожения криптографического ключа.
                Этот раздел присутствует только в том случае, если ключ запланирован к уничтожению
                или уже уничтожен
              properties:
                status:
                  type: string
                  description: |-
                    Текущий статус процесса уничтожения криптографического ключа.
                    Это поле заполняется только тогда, когда ключ находится в одном из статусов уничтожения.
                    Возможные значения:
                    - SCHEDULED_FOR_DESTRUCTION: криптографический ключ запланирован к уничтожению в будущем
                    - DESTROYED: криптографический ключ был окончательно уничтожен и не может быть восстановлен
                  enum:
                    - "SCHEDULED_FOR_DESTRUCTION"
                    - "DESTROYED"
                scheduledDestructionTime:
                  type: string
                  description: |-
                    Временная метка, указывающая, когда ключ должен быть уничтожен.
                    Если это поле установлено, ключ будет автоматически уничтожен в указанное время
                  format: date-time
                  example: 2025-08-01T12:00:00Z
                destroyTime:
                  type: string
                  description: Время уничтожения криптографического ключа
                  format: date-time
                  example: 2025-11-01T12:00:00Z
              nullable: true

    ResourceStatusResponse:
      type: object
      description: Текущее состояние ресурса, вычисляемое системой
      properties:
        ready:
          $ref: '#/components/schemas/ResourceStatusReadyResponse'
          description: Информация о статусе реконсиляции
      required:
        - ready

    ResourceStatusReadyResponse:
      type: object
      description: Информация о статусе реконсиляции
      properties:
        state:
          $ref: '#/components/schemas/ResourceStatusState'
          description: Состояние ресурса
        message:
          type: string
          description: Описание статуса
          example: Success operation
      required:
        - state

    ResourceStatusState:
      type: string
      description: Состояние ресурса
      enum:
        - "OK"
        - "FAILED"
        - "PROCESSING"

    NextPageToken:
      type: string
      description: Строка, которую нужно передать в следующем запросе, чтобы получить следующую страницу. Для последней страницы не задан

    CryptoKeyRequest:
      type: object
      description: Ключ — ресурс облака, который объединяет несколько экземпляров криптографических ключей, называемых версиями ключа
      properties:
        metadata:
          allOf:
            - $ref: '#/components/schemas/CommonTypedResourceMetadataRequest'
          description: Набор общих для всех пользовательских объектов атрибутов. Может быть расширен атрибутами, специфичными для контейнеров
          nullable: true
        spec:
          $ref: '#/components/schemas/CryptoKeySpecRequest'
          description: Обязательно для заполнения при создании ресурса

    CommonTypedResourceMetadataRequest:
      type: object
      description: Набор общих для всех пользовательских объектов атрибутов. Может быть расширен атрибутами, специфичными для контейнеров
      properties:
        displayName:
          type: string
          description: Отображаемое имя свойства
        etag:
          type: string
          description: Идентификатор состояния ресурса, позволяет отслеживать изменение ресурса
        description:
          type: string
          description: Описание ресурса

    CryptoKeySpecRequest:
      type: object
      properties:
        defaultAlgorithm:
          $ref: '#/components/schemas/CryptoKeyAlgorithm'
          description: |-
            Криптографический алгоритм по-умолчанию, используемый для выпуска новых версий ключа.
            Этот алгоритм будет применяться при создании новых версий ключа во время ротации
        destructionPolicy:
          type: object
          description: Политика уничтожения ключа. Определяет параметры и расписание
          properties:
            defaultDestructionIntervalDays:
              type: integer
              description: |-
                Указывает количество дней, по истечении которых ключ будет окончательно уничтожен,
                начиная с момента отправки запроса на удаление.
                Значение можно задать только при создании ключа, и оно не может быть изменено позже.
                Если значение не указано при создании ключа, используется значение по умолчанию (1 день)
              
                Неизменяемое поле. Задается только при создании ресурса.
                При обновлении ресурса можно передать только текущее значение
              format: int32
              default: 1
              example: 7
          nullable: true
        usagePolicy:
          type: object
          description: Политика использования ключа. Определяет, разрешены ли криптографические операции с этим ключом
          properties:
            enabled:
              type: boolean
              description: |-
                Флаг, указывающий, разрешены ли криптографические операции с этим ключом.
                Если значение установлено в `false`, все операции шифрования, расшифровки и другие
                криптографические операции с этим ключом будут заблокированы
              default: true
          nullable: true
        rotationPolicy:
          type: object
          description: Параметры политики, управляющие ротацией криптографического ключа
          properties:
            enabled:
              type: boolean
              description: Флаг, указывающий, включена ли автоматическая ротация для ключа
              default: true
            rotationIntervalDays:
              type: integer
              description: Интервал в днях, через который должна выполняться ротация криптографического ключа
              format: int32
              example: 30
          nullable: true
        primaryKeyVersionRef:
          type: string
          description: |-
            Идентификатор основной версии криптографического ключа.
            Используется только когда автоматическая ротация отключена
          
            Строка в форматах:
              Полный формат:
                - "kms/projects/{project}/cryptoKeys/{key}/cryptoKeyVersions/{version}"
              Сокращенные форматы:
                - "projects/{project}/cryptoKeys/{key}/cryptoKeyVersions/{version}"
                - "cryptoKeys/{key}/cryptoKeyVersions/{version}"
                - "cryptoKeyVersions/{version}"
                - "{version}"
          
            Полный формат всегда корректен.
            Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
          
            Примеры:
              - "kms/projects/myProject/cryptoKeys/myKey/cryptoKeyVersions/myVersion"
              - "projects/myProject/cryptoKeys/myKey/cryptoKeyVersions/myVersion"
              - "cryptoKeys/myKey/cryptoKeyVersions/myVersion"
              - "cryptoKeyVersions/myVersion"
              - "myVersion"
          nullable: true

    GenerateDataKeyRequest:
      type: object
      properties:
        version:
          type: integer
          description: Версия криптографического ключа, используемая для шифрования ключа данных
          format: int32
          example: 3
        bits:
          type: integer
          description: Длина генерируемого ключа (в битах — 128, 192, 256)
          format: int32
          example: 256
        associatedData:
          type: string
          description: |-
            Дополнительные данные, которые могут быть включены в процесс аутентифицированного шифрования
          
            Поле содержит чувствительные данные. Ограничьте доступ к ним
          format: byte
        ciphertextOnly:
          type: boolean
          description: Если установлено значение `true`, будет возвращено только зашифрованное значение (ciphertext)
      required:
        - bits

    GenerateDataKeyResponse:
      type: object
      properties:
        version:
          type: integer
          description: Версия криптографического ключа, используемая для шифрования ключа данных
          format: int32
          example: 3
        dataKeyCiphertext:
          type: string
          description: |-
            Зашифрованный ключ шифрования данных
          
            Поле содержит чувствительные данные. Ограничьте доступ к ним
          format: byte
        dataKeyPlaintext:
          type: string
          description: |-
            Сгенерированный ключ шифрования данных
          
            Поле содержит чувствительные данные. Ограничьте доступ к ним
          format: byte
      required:
        - version
        - dataKeyCiphertext

    EncryptRequest:
      type: object
      properties:
        version:
          type: integer
          description: Версия криптографического ключа, используемая для шифрования открытых данных
          format: int32
          example: 3
        plaintext:
          type: string
          description: |-
            Открытые данные, которые необходимо зашифровать. Должны быть закодированы в base64
          
            Поле содержит чувствительные данные. Ограничьте доступ к ним
          format: byte
        associatedData:
          type: string
          description: |-
            Дополнительные данные, которые могут быть включены в процесс аутентифицированного шифрования
          
            Поле содержит чувствительные данные. Ограничьте доступ к ним
          format: byte
      required:
        - plaintext

    EncryptResponse:
      type: object
      properties:
        version:
          type: integer
          description: Версия криптографического ключа, используемая для шифрования открытых данных
          format: int32
          example: 3
        ciphertext:
          type: string
          description: |-
            Полученный шифротекст
          
            Поле содержит чувствительные данные. Ограничьте доступ к ним
          format: byte
      required:
        - version
        - ciphertext

    DecryptRequest:
      type: object
      properties:
        ciphertext:
          type: string
          description: |-
            Шифротекст, который необходимо расшифровать
          
            Поле содержит чувствительные данные. Ограничьте доступ к ним
          format: byte
        associatedData:
          type: string
          description: |-
            Дополнительные данные, которые могут быть включены в процесс аутентифицированного шифрования
          
            Поле содержит чувствительные данные. Ограничьте доступ к ним
          format: byte
      required:
        - ciphertext

    DecryptResponse:
      type: object
      properties:
        plaintext:
          type: string
          description: |-
            Полученный открытый текст
          
            Поле содержит чувствительные данные. Ограничьте доступ к ним
          format: byte
        version:
          type: integer
          description: Версия криптографического ключа, использованная для расшифровки
          format: int32
          example: 3
      required:
        - plaintext
        - version

    ReEncryptRequest:
      type: object
      properties:
        ciphertext:
          type: string
          description: |-
            Зашифрованные данные (шифротекст)
          
            Поле содержит чувствительные данные. Ограничьте доступ к ним
          format: byte
        sourceKeyRef:
          type: string
          description: |-
            Ссылка на `CryptoKey`, с помощью которого данные в данный момент зашифрованы.
            Если значение не указано, для определения `sourceKeyRef` будут использованы поля `destinationProject` и `destinationKey`
          
            Строка в форматах:
              Полный формат:
                - "kms/projects/{project}/cryptoKeys/{key}"
              Сокращенные форматы:
                - "projects/{project}/cryptoKeys/{key}"
                - "cryptoKeys/{key}"
                - "{key}"
          
            Полный формат всегда корректен.
            Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
          
            Неизменяемое поле. Задается только при создании ресурса.
            При обновлении ресурса можно передать только текущее значение
          
            Примеры:
              - "kms/projects/myProject/cryptoKeys/myKey"
              - "projects/myProject/cryptoKeys/myKey"
              - "cryptoKeys/myKey"
              - "myKey"
        sourceAssociatedData:
          type: string
          description: |-
            Дополнительные данные, которые были включены в исходный процесс аутентифицированного шифрования
          

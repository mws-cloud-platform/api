        - zone

    ClickhouseStorageConfigurationResponse:
      type: object
      description: Конфигурация схемы хранилищ ClickHouse
      properties:
        hybridStorageEnabled:
          type: boolean
          description: Включить гибридное хранилище (hot SSD + cold S3)
        moveFactor:
          type: number
          description: Соотношение свободного дискового пространства на SSD дисках кластера (от 0.01 до 1) Когда это соотношение превышает значение параметра конфигурации, ClickHouse начинает перемещать данные в следующий том по порядку
          format: float64
          default: 0.1
          example: 0.3
        dataCachingEnabled:
          type: boolean
          description: Включить кеширование данных с объектного хранилища на сетевых SSD дисках
        cacheMaxSize:
          type: string
          description: |-
            Максимальный размер кеша объектного хранилища, расположенный на SSD
          
            Размер в байтах. Формат: <число> [единица измерения].
            Допустимые единицы измерения: `B`, `KB`, `MB`, `GB`, `TB`, `PB`, `EB`, `ZB`, `YB`, `RB`, `QB`. По умолчанию: `B`.
            Допустимые значения — положительные целые числа и дробные числа с ненулевой целой частью.
            Значение базовой единицы измерения (в байтах) должно оставаться целым.
            Регистр и лишние пробелы перед строкой, после строки и между ее частями игнорируются
          
            Примеры:
              - "1"
              - "1 B"
              - "1024 kb"
              - "1.5 TB"
          default: 1Gb
        maxDataPartSizeSsd:
          type: string
          description: |-
            Максимальный размер части данных в байтах, который может храниться на дисках тома (SSD)
          
            Размер в байтах. Формат: <число> [единица измерения].
            Допустимые единицы измерения: `B`, `KB`, `MB`, `GB`, `TB`, `PB`, `EB`, `ZB`, `YB`, `RB`, `QB`. По умолчанию: `B`.
            Допустимые значения — положительные целые числа и дробные числа с ненулевой целой частью.
            Значение базовой единицы измерения (в байтах) должно оставаться целым.
            Регистр и лишние пробелы перед строкой, после строки и между ее частями игнорируются
          
            Примеры:
              - "1"
              - "1 B"
              - "1024 kb"
              - "1.5 TB"
          default: 10Gb
          example: 10Gb


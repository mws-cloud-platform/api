            Пример: "mclickhouse/projects/myProject/clusters/myCluster/shards/myShard/instances/myInstance"
        index:
          type: integer
          description: Индекс реплики в шарде в кластере ClickHouse, который будет указан в настройках кластера в макросе `replica`. Влияет на очередность исполнения распределенных запросов в кластере
        zone:

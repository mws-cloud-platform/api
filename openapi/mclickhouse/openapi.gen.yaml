    ClickhouseEndpointResourceResponse:
      type: object
      description: Описание эндпойнта кластера в пользовательской сети (VPC)
      properties:
        address:
          $ref: '#/components/schemas/ClickhouseEndpointAddressResourceResponse'
          description: Описание эндпойнта кластера в пользовательской сети (VPC)
        externalAddress:
          allOf:
            - $ref: '#/components/schemas/ClickhouseEndpointExternalAddressResourceResponse'
          description: Описание внешнего доступа к кластеру
          nullable: true
      required:
        - address

    ClickhouseEndpointAddressResourceResponse:
      type: object
      description: Описание эндпойнта кластера в пользовательской сети (VPC)
      properties:
        ref:
          type: string
          description: |-
            Идентификатор адреса в VPC
          
            Строка в форматах:
              Полный формат:
                - "vpc/projects/{project}/networks/{network}/addresses/{address}"
              Сокращенные форматы:
                - "projects/{project}/networks/{network}/addresses/{address}"
                - "networks/{network}/addresses/{address}"
                - "addresses/{address}"
                - "{address}"
          
            Полный формат всегда корректен.
            Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
          
            Примеры:
              - "vpc/projects/myProject/networks/myNetwork/addresses/myAddress"
              - "projects/myProject/networks/myNetwork/addresses/myAddress"
              - "networks/myNetwork/addresses/myAddress"
              - "addresses/myAddress"
              - "myAddress"
        subnet:
          type: string
          description: |-
            Идентификатор подсети облачной сети, к которой принадлежит адрес
          
            Строка в форматах:
              Полный формат:
                - "vpc/projects/{project}/networks/{network}/subnets/{subnet}"
              Сокращенные форматы:
                - "projects/{project}/networks/{network}/subnets/{subnet}"
                - "networks/{network}/subnets/{subnet}"
                - "subnets/{subnet}"
                - "{subnet}"
          
            Полный формат всегда корректен.
            Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
          
            Примеры:
              - "vpc/projects/myProject/networks/myNetwork/subnets/mySubnet"
              - "projects/myProject/networks/myNetwork/subnets/mySubnet"
              - "networks/myNetwork/subnets/mySubnet"
              - "subnets/mySubnet"
              - "mySubnet"
        ipAddress:
          type: string
          description: |-
            Выделенный адрес
          
            IPv4- или IPv6-адрес
          
            Примеры:
              - "192.168.1.1"
              - "2001:db8:130F::9C0:876A:130B"
        dns:
          type: array
          description: Доменные имена
          items:
            $ref: '#/components/schemas/ClickhouseEndpointAddressDnsResourceResponse'
      required:
        - ref
        - subnet
        - ipAddress
        - dns

    ClickhouseEndpointAddressDnsResourceResponse:
      type: object
      description: Описание DNS имени, назначенного адресу в пользовательской сети
      properties:
        name:
          type: string
          description: DNS-имя
      required:
        - name

    ClickhouseEndpointExternalAddressResourceResponse:
      type: object
      description: Описание внешнего доступа к кластеру
      properties:

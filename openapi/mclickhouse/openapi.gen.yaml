        spec:
          $ref: '#/components/schemas/ClickhouseClusterUserSpecRequest'
          description: Обязательно для заполнения при создании ресурса

    ClickhouseClusterUserSpecRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/ClickhouseClusterUserRole'
          description: |-
            Пользовательские роли (они же роли приложений):
            - `DB_ADMIN`: Пользователь с правами администратора базы данных.
            - `DB_WRITER`: Пользовательская роль с доступом на запись/чтение.
            - `DB_READER`: Пользовательская роль с доступом на чтение
        password:
          type: string
          description: |-
            Пароль учетной записи пользователя
          
            Поле содержит чувствительные данные. Ограничьте доступ к ним
          
            Обязательно для заполнения при создании ресурса

    ClickhouseBackupPageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClickhouseBackupResponse'
        nextPageToken:
          $ref: '#/components/schemas/NextPageToken'
          description: Строка, которую нужно передать в следующем запросе, чтобы получить следующую страницу. Для последней страницы не задан
      required:
        - items

    ClickhouseBackupResponse:
      type: object
      description: Резервное копирование в Managed ClickHouse позволяет автоматизировать создание резервных копий кластера и его восстановление. С помощью резервных копий можно восстановить данные в новый кластер в случае повреждения, потери данных или совершения ошибочных операций
      properties:
        kind:
          type: string
          default: mclickhouse/v1/backup
        metadata:
          type: object
          allOf:
            - $ref: '#/components/schemas/TypedResourceMetadataResponse'
            - type: object
              properties:
                id:
                  type: string
                  description: |-
                    Ссылка на типизированный референс
                  
                    Строка в формате: "mclickhouse/projects/{project}/clusters/{cluster}/backups/{backup}"
                  
                    Пример: "mclickhouse/projects/myProject/clusters/myCluster/backups/myBackup"
          nullable: true
        spec:
          allOf:
            - $ref: '#/components/schemas/ClickhouseBackupSpecResponse'
          nullable: true
        status:
          allOf:
            - $ref: '#/components/schemas/ClickhouseBackupStatusResponse'
          nullable: true

    ClickhouseBackupSpecResponse:
      type: object

    ClickhouseBackupStatusResponse:
      type: object
      allOf:
        - $ref: '#/components/schemas/ResourceStatusResponse'
        - type: object
          properties:
            backup:
              type: object
              properties:
                trigger:
                  type: string
                  description: Причина создания резервной копии в CPL
                  enum:
                    - "AUTOMATIC"
                    - "USER"
                type:
                  type: string
                  description: Причина создания резервной копии в CPL
                  enum:
                    - "FULL"
                    - "INCREMENTAL"
                startTime:
                  type: string
                  description: Начало снятия резервной копии
                  format: date-time
                endTime:
                  type: string
                  description: Окончание снятия резервной копии
                  format: date-time
                size:
                  type: string
                  description: |-
                    Размер резервной копии
                  
                    Размер в байтах. Формат: <число> [единица измерения].
                    Допустимые единицы измерения: `B`, `KB`, `MB`, `GB`, `TB`, `PB`, `EB`, `ZB`, `YB`, `RB`, `QB`. По умолчанию: `B`.
                    Допустимые значения — положительные целые числа и дробные числа с ненулевой целой частью.
                    Значение базовой единицы измерения (в байтах) должно оставаться целым.
                    Регистр и лишние пробелы перед строкой, после строки и между ее частями игнорируются
                  
                    Примеры:
                      - "1"
                      - "1 B"
                      - "1024 kb"
                      - "1.5 TB"
                totalSize:
                  type: string
                  description: |-
                    Размер всех файлов резервной копии (в распакованном и несжатом виде)
                  
                    Размер в байтах. Формат: <число> [единица измерения].
                    Допустимые единицы измерения: `B`, `KB`, `MB`, `GB`, `TB`, `PB`, `EB`, `ZB`, `YB`, `RB`, `QB`. По умолчанию: `B`.
                    Допустимые значения — положительные целые числа и дробные числа с ненулевой целой частью.
                    Значение базовой единицы измерения (в байтах) должно оставаться целым.
                    Регистр и лишние пробелы перед строкой, после строки и между ее частями игнорируются
                  
                    Примеры:
                      - "1"
                      - "1 B"
                      - "1024 kb"
                      - "1.5 TB"
              required:
                - trigger
                - type
              nullable: true

    ClickhouseBackupRequest:
      type: object
      description: Резервное копирование в Managed ClickHouse позволяет автоматизировать создание резервных копий кластера и его восстановление. С помощью резервных копий можно восстановить данные в новый кластер в случае повреждения, потери данных или совершения ошибочных операций
      properties:
        metadata:
          $ref: '#/components/schemas/TypedResourceMetadataRequest'
        spec:
          allOf:
            - $ref: '#/components/schemas/ClickhouseBackupSpecRequest'
          nullable: true

    ClickhouseBackupSpecRequest:
      type: object

    ClickhouseClusterRestoreRequest:
      type: object
      properties:
        spec:
          $ref: '#/components/schemas/ClickhouseClusterRestoreSpecRequest'
          description: Параметры восстанавливаемого кластера
      required:
        - spec

    ClickhouseClusterRestoreSpecRequest:
      type: object
      description: Параметры восстанавливаемого кластера
      properties:
        bootstrapAdmin:
          $ref: '#/components/schemas/ClickhouseClusterBootstrapAdminSpecRequest'
          description: Добавление пользователей при создании кластера ClickHouse
      required:
        - bootstrapAdmin

    ClickhouseClusterVmTypesResponse:
      type: object
      description: Типы ВМ кластера ClickHouse
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClickhouseVmTypeResponse'
      required:
        - items

    ClickhouseVmTypeResponse:
      type: object
      description: Тип ВМ
      properties:
        metadata:
          type: object
          description: Метаданные типа ВМ
          allOf:
            - $ref: '#/components/schemas/TypedResourceMetadataResponse'
            - type: object
              properties:
                id:
                  type: string
                  description: |-
                    ID свойства
                  
                    Строка в формате: "mclickhouse/vmTypes/{vmType}"
                  
                    Пример: "mclickhouse/vmTypes/myVmType"
              required:
                - id
          nullable: true
        spec:
          type: object
          description: Спецификация типа ВМ
          allOf:
            - $ref: '#/components/schemas/VmTypeSpecResponse'
            - type: object
              properties:
                instanceTypes:
                  type: array
                  description: Описание типов узлов для ВМ данного типа
                  items:
                    $ref: '#/components/schemas/VmTypeInstance'
        status:
          $ref: '#/components/schemas/ClickhouseVmTypeStatusResponse'
          description: Статус типа ВМ
      required:
        - spec
        - status

    VmTypeSpecResponse:
      type: object
      description: Спецификация типа ВМ
      properties:
        cpu:
          allOf:
            - $ref: '#/components/schemas/VmTypeCpuSpecResponse'
          description: Спецификация процессора, который доступен для ВМ указанного типа
          nullable: true
        memory:
          allOf:
            - $ref: '#/components/schemas/VmTypeMemorySpecResponse'
          description: Спецификация RAM, которая доступна для ВМ указанного типа
          nullable: true

    VmTypeCpuSpecResponse:
      type: object
      description: Спецификация процессора, который доступен для ВМ указанного типа
      properties:
        vcpuCount:
          type: string
          description: Количество виртуальных ядер
          format: int32
          example: "2"

    VmTypeMemorySpecResponse:
      type: object
      description: Спецификация RAM, которая доступна для ВМ указанного типа
      properties:
        capacity:
          type: string
          description: |-
            Количество оперативной памяти
          
            Размер в байтах. Формат: <число> [единица измерения].
            Допустимые единицы измерения: `B`, `KB`, `MB`, `GB`, `TB`, `PB`, `EB`, `ZB`, `YB`, `RB`, `QB`. По умолчанию: `B`.
            Допустимые значения — положительные целые числа и дробные числа с ненулевой целой частью.
            Значение базовой единицы измерения (в байтах) должно оставаться целым.
            Регистр и лишние пробелы перед строкой, после строки и между ее частями игнорируются
          
            Примеры:
              - "1"
              - "1 B"
              - "1024 kb"
              - "1.5 TB"
          example: 16 GB

    VmTypeInstance:
      type: string
      description: Virtual machine instance type
      enum:
        - "CLICKHOUSE"
        - "COORDINATOR"

    ClickhouseVmTypeStatusResponse:
      type: object
      description: Статус типа ВМ
      properties:
        zones:
          type: array
          description: Зоны, в которых доступен тип ВМ. Пустой список означает, что тип недоступен ни в одной зоне
          items:
            $ref: '#/components/schemas/ClickhouseVmTypeStatusZoneResponse'
      required:
        - zones

    ClickhouseVmTypeStatusZoneResponse:
      type: object
      description: Зона доступности типа ВМ
      properties:
        name:
          type: string
          description: Название зоны
          example: ru-central1-a
        region:
          type: string
          description: Название региона
          example: ru-central1
      required:
        - name

    ApiError:
      type: object
      description: Описание ошибки (если HTTP-статус отличен от 2xx)
      properties:
        code:
          type: string
          description: Короткий код ошибки
          enum:
            - "ALREADY_EXISTS"
            - "CANCELLED"
            - "DEADLINE_EXCEEDED"
            - "FAILED_PRECONDITION"
            - "INTERNAL"
            - "INVALID_ARGUMENT"
            - "NOT_FOUND"
            - "PERMISSION_DENIED"
            - "QUOTA_EXCEEDED"
            - "IDEMPOTENCY_KEY_ALREADY_USED"
            - "INVALID_ETAG_KEY"
            - "UNAUTHENTICATED"
            - "UNAVAILABLE"
            - "METHOD_NOT_ALLOWED"
            - "TOO_MANY_REQUESTS"
        type:
          type: string
          description: Подтип расширенной информации по ошибкам к которому удалось его привести. Null если привели к базовому типу
        description:
          type: string
          description: Развёрнутое пояснение ошибки
        retryPolicy:
          allOf:
            - $ref: '#/components/schemas/RetryPolicy'
          description: Правила выполнения повторных попыток в случае ошибки
          nullable: true
        details:
          type: object
          description: |-
            Детальная информация по ошибке в произвольном JSON формате. Содержимое не предназначено для машинной обработки
          
            Примеры:
              - '{"jsonPaths": [{"path": "foo.bar", "reason": "some reason", "offset": "line: 1, column: 2"}]}'
              - '{"errorInfo": "some error info"}'
          additionalProperties: true
      required:
        - code

    RetryPolicy:
      type: object
      description: Правила выполнения повторных попыток в случае ошибки
      properties:
        retryCount:
          type: integer
          description: Максимальное количество повторных попыток. 0 - значение по-умолчанию
        retryTimeout:
          type: string
          description: |-
            Пауза между повторными попытками
          
            Поддерживаются следующие форматы:
              - ISO 8601: P(n)DT(n)H(n)M(n)S. Допустимые единицы измерения: дни (`D`), часы (`H`), минуты (`M`), секунды (`S`). Только секунды могут быть дробными
              - Простой формат. Допустимые единицы измерения: `d`, `h`, `m`, `s`, `ms`, `us`, `ns`.
                Величины должны следовать по убыванию единиц измерения
              - Число в секундах
          
            Отрицательные значения обозначаются префиксом "-", в простом формате могут быть ограничены скобками.
            Регистр и пробелы игнорируются
          
            Примеры:
              - "PT1S"
              - "-PT4.2S"
              - "P1DT2H3M4S"
              - "42s"
              - "1h10m42s"
              - "-(1d 2h 3m 4s 5ms 6us 7ns)"
              - "42"
        retryTimeoutScale:
          $ref: '#/components/schemas/RetryTimeoutScale'
          description: Шаг увеличения таймаута
        maxRetryTimeout:
          type: string
          description: |-
            Максимальная длительность таймаута
          
            Поддерживаются следующие форматы:
              - ISO 8601: P(n)DT(n)H(n)M(n)S. Допустимые единицы измерения: дни (`D`), часы (`H`), минуты (`M`), секунды (`S`). Только секунды могут быть дробными
              - Простой формат. Допустимые единицы измерения: `d`, `h`, `m`, `s`, `ms`, `us`, `ns`.
                Величины должны следовать по убыванию единиц измерения
              - Число в секундах
          
            Отрицательные значения обозначаются префиксом "-", в простом формате могут быть ограничены скобками.
            Регистр и пробелы игнорируются
          
            Примеры:
              - "PT1S"
              - "-PT4.2S"
              - "P1DT2H3M4S"
              - "42s"
              - "1h10m42s"
              - "-(1d 2h 3m 4s 5ms 6us 7ns)"
              - "42"
      required:
        - retryCount
        - retryTimeout

    RetryTimeoutScale:
      type: string
      description: Шаг увеличения таймаута
      enum:
        - "FIXED"
        - "LINEAR"
        - "PROGRESSIVE"
        - "EXPONENTIAL"

  securitySchemes:
    BearerAuth:
      description: Токен авторизации IAM
      type: apiKey
      in: header
      name: Authorization

  parameters:
    header_Idempotency-Key:
      name: Idempotency-Key
      in: header
      description: Ключ идемпотентности
      style: simple
      schema:
        type: string

    path_backup:
      name: backup
      in: path
      required: true
      description: Имя резервной копии.
      style: simple
      schema:
        type: string
        pattern: ^[a-zA-Z-_][0-9a-zA-Z-_]*$

    path_cluster:
      name: cluster
      in: path
      required: true
      description: Название или идентификатор кластера.
      style: simple
      schema:
        type: string
        pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$

    path_project:
      name: project
      in: path
      required: true
      description: Путь к проекту.
      style: simple
      schema:
        type: string

    path_user:
      name: user
      in: path
      required: true
      description: Пользователь кластера
      style: simple
      schema:
        type: string
        pattern: ^[a-zA-Z0-9_][a-zA-Z0-9_-]{0,31}$

    query_createOnly:
      name: createOnly
      in: query
      description: Создать ресурс. Если ресурс уже существует, будет возвращен ответ `AlreadyExists`
      style: form
      explode: true
      schema:
        type: boolean

    query_filter:
      name: filter
      in: query
      description: |-
        Строка фильтра.
        Для фильтрации используется ограниченная реализация AIP-160 (https://google.aip.dev/160).
        Она включает в себя операции =, !=, OR, AND и (), фильтрацию свойств вложенных объектов и wildcard-поиск подстрок
      style: form
      explode: true
      schema:
        type: string

    query_orderBy:
      name: orderBy
      in: query
      description: |-
        Строка сортировки.
        Для сортировки используется реализация AIP-132 (https://google.aip.dev/132#ordering).
        Указывается перечислением полей с направлением сортировки (asc, desc) через запятую.
        По умолчанию используется сортировка по возрастанию (asc)
      style: form
      explode: true
      schema:
        type: string

    query_pageSize:
      name: pageSize
      in: query
      description: Максимальное количество объектов, которые клиент готов принять. Сервис определяет значение по умолчанию и верхнюю границу
      style: form
      explode: true
      schema:
        type: integer

    query_pageToken:
      name: pageToken
      in: query
      description: Строка, из предыдущего ответа на аналогичный запрос, для получения следующей страницы с объектами. Не задано для получения первой страницы
      style: form
      explode: true
      schema:
        type: string

    query_purge:
      name: purge
      in: query
      description: Удалить ресурс без возможности восстановления
      style: form
      explode: true
      schema:
        type: boolean

    query_region:
      name: region
      in: query
      description: Регион, для которого вернуть доступные типы ВМ.
      style: form
      explode: true
      schema:
        type: string
        pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$

    query_showDeleted:
      name: showDeleted
      in: query
      description: Вывод удаленных объектов для ресурсов, поддерживающих soft delete
      style: form
      explode: true
      schema:
        type: string

    query_updateOnly:
      name: updateOnly
      in: query
      description: |-
        Обновить ресурс, если он существует. Если ресурс не существует, будет возвращен ответ `Not Found`.
        Если прав на выполнение операции недостаточно, будет возвращен ответ `PermissionDenied`
      style: form
      explode: true
      schema:
        type: boolean

    query_version:
      name: version
      in: query
      required: true
      description: Версия продукта.
      style: form
      explode: true
      schema:
        type: string


                    Строка в формате: "mclickhouse/projects/{project}/clusters/{cluster}"
                  
                    Пример: "mclickhouse/projects/myProject/clusters/myCluster"
          nullable: true
        spec:
          $ref: '#/components/schemas/ClickhouseClusterSpecResponse'
          description: Параметры кластера
        status:
          allOf:
            - $ref: '#/components/schemas/ClickhouseClusterStatusResponse'
          nullable: true
      required:
        - spec

    TypedResourceMetadataResponse:
      type: object
      description: Набор общих для всех пользовательских объектов атрибутов. Может быть расширен атрибутами, специфичными для контейнеров
      properties:
        displayName:
          type: string
          description: Отображаемое имя. Необязательное поле, можно свободно задавать и изменять для удобства организации ресурсов
        createTime:
          type: string
          description: Дата создания объекта
          format: date-time
        updateTime:
          type: string
          description: Дата последнего изменения объекта
          format: date-time
        deleteTime:
          type: string
          description: Время запроса на удаление ресурса (не фактическое время удаления)
          format: date-time
        purgeTime:
          type: string
          description: Время удаления ресурса
          format: date-time
        usages:
          type: array
          description: Связи с другими ресурсами. В зависимости от типа связи операции над ресурсом могут быть ограничены
          items:
            $ref: '#/components/schemas/TypedUsageResponse'
        etag:
          type: string
          description: Идентификатор состояния ресурса, позволяет отслеживать изменение ресурса
        description:
          type: string
          description: Описание ресурса

    TypedUsageResponse:
      type: object
      properties:
        usageType:
          type: string
          description: Тип связи. Помимо стандартных `own` и `use` могут быть добавлены специализированные типы для конкретных сервисов
        resource:
          type: string
          description: |-
            Ссылка на ресурс
          
            Строка в формате: "servicename/foos/{foo}/bars/{bar}"
          
            Пример: "servicename/foos/myFoo/bars/myBar"
      required:
        - usageType
        - resource

    ClickhouseClusterSpecResponse:
      type: object
      description: Параметры кластера
      properties:
        active:
          type: boolean
          description: Состояние кластера — включен или выключен
          default: true
        version:
          type: string
          description: Версия продукта
        region:
          type: string
          description: |-
            Регион, в котором располагается кластер
          
            Строка в форматах:
              Полный формат:
                - "rm/regions/{region}"
              Сокращенные форматы:
                - "regions/{region}"
                - "{region}"
          
            Полный формат всегда корректен.
            Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
          
            Неизменяемое поле. Задается только при создании ресурса.
            При обновлении ресурса можно передать только текущее значение
          
            Примеры:
              - "rm/regions/myRegion"
              - "regions/myRegion"
              - "myRegion"
        endpoints:
          type: array
          description: Описание эндпоинтов кластера
          items:
            $ref: '#/components/schemas/ClickhouseEndpointResponse'
        coordinator:
          allOf:
            - $ref: '#/components/schemas/ClickhouseClusterCoordinatorResponse'
          description: Описание координатора кластера
          nullable: true
        shards:
          type: array
          description: Описание шардов кластера
          items:
            $ref: '#/components/schemas/ClickhouseClusterShardResponse'
        config:
          type: object
          description: Настройки ClickHouse. Если не указаны, будут использованы настройки по умолчанию
          additionalProperties:
            description: Значение не может равняться `null`
        storage:
          allOf:
            - $ref: '#/components/schemas/ClickhouseStorageConfigurationResponse'
          description: Конфигурация схемы хранилищ ClickHouse
          nullable: true
        bootstrapAdmin:
          $ref: '#/components/schemas/ClickhouseClusterBootstrapAdminSpecResponse'
          description: Добавление пользователей при создании кластера ClickHouse
        backup:
          allOf:
            - $ref: '#/components/schemas/ClickhouseClusterBackupResponse'
          description: Спецификация работы автоматического резервного копирования
          nullable: true
        maintenanceWindow:
          allOf:
            - $ref: '#/components/schemas/MaintenanceWindowResponse'
          nullable: true
      required:
        - version
        - shards
        - bootstrapAdmin

    ClickhouseEndpointResponse:
      type: object
      description: Описание спецификации эндпойнта кластера
      properties:
        address:
          $ref: '#/components/schemas/ClickhouseEndpointAddressSpecOrRefResponse'
          description: 'Описание адреса эндпоинта. Если указан `ref`, будет использован существующий внутренний адрес VPC. Если указан `spec`, будут созданы внутренние адреса в указанной подсети: для эндпоинта кластера или шарда — по одному адресу на эндпоинт, для эндпоинтов узлов — по одному адресу на каждый эндпоинт каждого созданного узла'
        externalAddress:
          allOf:
            - $ref: '#/components/schemas/ClickhouseEndpointExternalAddressSpecOrRefResponse'
          description: Описание шаблона внешнего адреса/адресов, которые будут выделены. Для `ref` будет выделен только один адрес, для `spec` будет выделено необходимое количество адресов в зависимости от сущности, для которой выделяются адреса
          nullable: true
      required:
        - address

    ClickhouseEndpointAddressSpecOrRefResponse:
      type: object
      description: 'Описание адреса эндпоинта. Если указан `ref`, будет использован существующий внутренний адрес VPC. Если указан `spec`, будут созданы внутренние адреса в указанной подсети: для эндпоинта кластера или шарда — по одному адресу на эндпоинт, для эндпоинтов узлов — по одному адресу на каждый эндпоинт каждого созданного узла'
      properties:
        ref:
          type: string
          description: |-
            Ссылка на внутренний адрес эндпоинта в VPC
          
            Строка в форматах:
              Полный формат:
                - "vpc/projects/{project}/networks/{network}/addresses/{address}"
              Сокращенные форматы:
                - "projects/{project}/networks/{network}/addresses/{address}"
                - "networks/{network}/addresses/{address}"
                - "addresses/{address}"
                - "{address}"
          
            Полный формат всегда корректен.
            Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
          
            Примеры:
              - "vpc/projects/myProject/networks/myNetwork/addresses/myAddress"
              - "projects/myProject/networks/myNetwork/addresses/myAddress"
              - "networks/myNetwork/addresses/myAddress"
              - "addresses/myAddress"
              - "myAddress"
        spec:
          allOf:
            - $ref: '#/components/schemas/ClickhouseEndpointAddressSpecResponse'
          description: Описание шаблона адреса, который будет использоваться при выделении адресов
          nullable: true

    ClickhouseEndpointAddressSpecResponse:
      type: object
      description: Описание шаблона адреса, который будет использоваться при выделении адресов
      properties:
        subnet:
          type: string
          description: |-
            Подсеть облачной сети, которой принадлежит адрес
          
            Строка в форматах:
              Полный формат:
                - "vpc/projects/{project}/networks/{network}/subnets/{subnet}"
              Сокращенные форматы:
                - "projects/{project}/networks/{network}/subnets/{subnet}"
                - "networks/{network}/subnets/{subnet}"
                - "subnets/{subnet}"
                - "{subnet}"
          
            Полный формат всегда корректен.
            Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
          
            Примеры:
              - "vpc/projects/myProject/networks/myNetwork/subnets/mySubnet"
              - "projects/myProject/networks/myNetwork/subnets/mySubnet"
              - "networks/myNetwork/subnets/mySubnet"
              - "subnets/mySubnet"
              - "mySubnet"
      required:
        - subnet

    ClickhouseEndpointExternalAddressSpecOrRefResponse:
      type: object
      description: Описание шаблона внешнего адреса/адресов, которые будут выделены. Для `ref` будет выделен только один адрес, для `spec` будет выделено необходимое количество адресов в зависимости от сущности, для которой выделяются адреса
      properties:
        ref:
          type: string
          description: |-
            Ссылка на внешний адрес эндпоинта в VPC
          
            Строка в форматах:
              Полный формат:
                - "vpc/projects/{project}/externalAddresses/{externalAddress}"
              Сокращенные форматы:
                - "projects/{project}/externalAddresses/{externalAddress}"
                - "externalAddresses/{externalAddress}"
                - "{externalAddress}"
          
            Полный формат всегда корректен.
            Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
          
            Примеры:
              - "vpc/projects/myProject/externalAddresses/myExternalAddress"
              - "projects/myProject/externalAddresses/myExternalAddress"
              - "externalAddresses/myExternalAddress"
              - "myExternalAddress"
        spec:
          allOf:
            - $ref: '#/components/schemas/ClickhouseEndpointExternalAddressSpecResponse'
          description: Описание шаблона внешнего адреса, который будет использоваться при выделении адресов
          nullable: true

    ClickhouseEndpointExternalAddressSpecResponse:
      type: object
      description: Описание шаблона внешнего адреса, который будет использоваться при выделении адресов

    ClickhouseClusterCoordinatorResponse:
      type: object
      description: Описание координатора кластера
      properties:
        type:
          $ref: '#/components/schemas/ClickhouseCoordinatorType'
          description: |-
            Тип координатора. Если не указано, то при наличии более одного узла, используется ClickHouse Keeper
          
            Неизменяемое поле. Задается только при создании ресурса.
            При обновлении ресурса можно передать только текущее значение
        resources:
          $ref: '#/components/schemas/ClickhouseCoordinatorHWResourcesResponse'
          description: Параметры виртуальной машины, на которой будет работать ClickHouse Keeper. Необязательный параметр в standalone-конфигурации
        instances:
          type: array
          description: |-
            Неизменяемое поле. Задается только при создании ресурса.
            При обновлении ресурса можно передать только текущее значение
          items:
            $ref: '#/components/schemas/ClickhouseClusterCoordinatorInstanceResponse'
      required:
        - resources
        - instances

    ClickhouseCoordinatorType:
      type: string
      description: Тип координатора. Если не указано, то при наличии более одного узла, используется ClickHouse Keeper
      enum:
        - "CLICKHOUSE_KEEPER"
        - "ZOOKEEPER"
      default: CLICKHOUSE_KEEPER

    ClickhouseCoordinatorHWResourcesResponse:
      type: object
      description: Ресурсы одного узла-координатора ClickHouse Keeper
      properties:
        vmType:
          type: string
          description: |-
            Тип виртуальной машины, описывающий ресурсы (vCPU, memory)
          
            Строка в форматах:
              Полный формат:
                - "mclickhouse/vmTypes/{vmType}"
              Сокращенные форматы:
                - "vmTypes/{vmType}"
                - "{vmType}"
          
            Полный формат всегда корректен.
            Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
          
            Примеры:
              - "mclickhouse/vmTypes/myVmType"
              - "vmTypes/myVmType"
              - "myVmType"
        disk:
          $ref: '#/components/schemas/ClickhouseInstanceDiskSpecResponse'
          description: Параметры диска
      required:
        - vmType
        - disk

    ClickhouseInstanceDiskSpecResponse:
      type: object
      description: Параметры диска
      properties:
        size:
          type: string
          description: |-
            Размер диска
          
            Размер в байтах. Формат: <число> [единица измерения].
            Допустимые единицы измерения: `B`, `KB`, `MB`, `GB`, `TB`, `PB`, `EB`, `ZB`, `YB`, `RB`, `QB`. По умолчанию: `B`.
            Допустимые значения — положительные целые числа и дробные числа с ненулевой целой частью.
            Значение базовой единицы измерения (в байтах) должно оставаться целым.
            Регистр и лишние пробелы перед строкой, после строки и между ее частями игнорируются
          
            Примеры:
              - "1"
              - "1 B"
              - "1024 kb"
              - "1.5 TB"
        type:
          $ref: '#/components/schemas/ClickhouseDataDiskType'
          description: |-
            Тип используемого диска:
            * `NETWORK_STANDARD_SSD` — сетевой SSD
        iops:
          $ref: '#/components/schemas/Iops'
          description: IOPS
      required:
        - size
        - type

    ClickhouseDataDiskType:
      type: string
      description: |-
        Тип используемого диска:
        * `NETWORK_STANDARD_SSD` — сетевой SSD
      enum:
        - "NETWORK_STANDARD_SSD"

    Iops:
      type: integer
      description: IOPS
      format: int32
      example: 1000

    ClickhouseClusterCoordinatorInstanceResponse:
      type: object
      description: Описание узла координатора
      properties:
        count:
          type: integer
          description: Количество узлов в зоне доступности
          default: 1
        zone:
          type: string
          description: |-
            Зона доступности
          
            Строка в форматах:
              Полный формат:
                - "rm/zones/{zone}"
              Сокращенные форматы:
                - "zones/{zone}"
                - "{zone}"
          
            Полный формат всегда корректен.
            Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
          
            Примеры:
              - "rm/zones/myZone"
              - "zones/myZone"
              - "myZone"
      required:
        - zone

    ClickhouseClusterShardResponse:
      type: object
      description: Описание спецификации шарда кластера
      properties:
        name:
          type: string
          description: |-
            -> Имя шарда, которому будут принадлежать узлы. В случае с несколькими шардами имя формируется как `name-{shardIndex}`
          
            Неизменяемое поле. Задается только при создании ресурса.
            При обновлении ресурса можно передать только текущее значение
        resources:
          $ref: '#/components/schemas/ClickhouseInstanceHWResourcesResponse'
          description: Ресурсы одного узла ClickHouse
        weight:
          type: integer
          description: Вес шарда
          default: 1
        endpoints:
          type: array
          description: Описание эндпоинтов шардов
          items:
            $ref: '#/components/schemas/ClickhouseEndpointResponse'
        instances:
          type: array
          items:
            $ref: '#/components/schemas/ClickhouseClusterInstanceResponse'
      required:
        - name
        - resources
        - instances

    ClickhouseInstanceHWResourcesResponse:
      type: object
      description: Ресурсы одного узла ClickHouse
      properties:
        vmType:
          type: string
          description: |-
            Тип виртуальной машины, описывающий ресурсы (vCPU, memory)
          
            Строка в форматах:
              Полный формат:
                - "mclickhouse/vmTypes/{vmType}"
              Сокращенные форматы:
                - "vmTypes/{vmType}"
                - "{vmType}"
          
            Полный формат всегда корректен.
            Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
          
            Примеры:
              - "mclickhouse/vmTypes/myVmType"
              - "vmTypes/myVmType"
              - "myVmType"
        disk:
          $ref: '#/components/schemas/ClickhouseInstanceDiskSpecResponse'
          description: Параметры диска
      required:
        - vmType
        - disk

    ClickhouseClusterInstanceResponse:
      type: object
      description: Описание узла кластера
      properties:
        name:
          type: string
          description: |-
            -> Имя узла или узлов в шарде. В случае count>1, имя формируется как name{replicaIndex}, где replicaIndex имеет сквозную нумерацию в рамках указанного имени
          
            Неизменяемое поле. Задается только при создании ресурса.
            При обновлении ресурса можно передать только текущее значение
        count:
          type: integer
          description: Количество узлов в зоне доступности
          default: 1
        zone:
          type: string
          description: |-
            Зона доступности
          
            Строка в форматах:
              Полный формат:
                - "rm/zones/{zone}"
              Сокращенные форматы:
                - "zones/{zone}"
                - "{zone}"
          
            Полный формат всегда корректен.
            Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
          
            Примеры:
              - "rm/zones/myZone"
              - "zones/myZone"
              - "myZone"
        endpoints:
          type: array
          description: Описание эндпоинтов узлов
          items:
            $ref: '#/components/schemas/ClickhouseEndpointResponse'
      required:

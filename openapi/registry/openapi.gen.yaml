          description: Допустимые HTTP-коды ошибок — 400, 403, 404, 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  schemas:
    RegistryListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RegistryResponse'
        nextPageToken:
          $ref: '#/components/schemas/NextPageToken'
          description: Строка, которую нужно передать в следующем запросе, чтобы получить следующую страницу. Для последней страницы не задан
      required:
        - items

    RegistryResponse:
      type: object
      description: Реестр
      properties:
        kind:
          type: string
          default: registry/v1/registry
        metadata:
          allOf:
            - $ref: '#/components/schemas/CommonTypedResourceMetadataResponse'
          description: Набор общих для всех пользовательских объектов атрибутов. Может быть расширен атрибутами, специфичными для контейнеров
          nullable: true
        spec:
          $ref: '#/components/schemas/RegistrySpecResponse'
          description: Спецификация реестра
        status:
          allOf:
            - $ref: '#/components/schemas/RegistryStatusResponse'
          description: Статус реестра
          nullable: true
      required:
        - spec

    CommonTypedResourceMetadataResponse:
      type: object
      description: Набор общих для всех пользовательских объектов атрибутов. Может быть расширен атрибутами, специфичными для контейнеров
      properties:
        id:
          type: string
          description: |-
            ID свойства
          
            Строка в формате: "servicename/foos/{foo}/bars/{bar}"
          
            Пример: "servicename/foos/myFoo/bars/myBar"
        displayName:
          type: string
          description: Отображаемое имя свойства
        createTime:
          type: string
          description: Дата создания объекта
          format: date-time
        updateTime:
          type: string
          description: Дата последнего изменения объекта
          format: date-time
        deleteTime:
          type: string
          description: Время запроса на удаление ресурса
          format: date-time
        purgeTime:
          type: string
          description: Время удаления ресурса
          format: date-time
        usages:
          type: array
          description: Связи с другими ресурсами. В зависимости от типа связи, операции над ресурсом могут быть ограничены
          items:
            $ref: '#/components/schemas/UsageResponse'
        etag:
          type: string
          description: Идентификатор состояния ресурса, позволяет отслеживать изменение ресурса
        description:
          type: string
          description: Описание ресурса

    UsageResponse:
      type: object
      properties:
        usageType:
          type: string
          description: Тип связи. Помимо стандартных own и use могут быть добавлены специализированные типы для конкретных сервисов
        name:
          type: string
          description: Имя связи, требуется для модификации коллекции
        resource:
          type: string
          description: Ссылка на ресурс
      required:
        - usageType
        - name
        - resource

    RegistrySpecResponse:
      type: object
      description: Спецификация реестра
      properties:
        lifecyclePolicy:
          type: string
          description: |-
            Идентификатор политики жизненного цикла
          
            Строка в форматах:
              Полный формат:
                - "registry/projects/{project}/registries/{registry}/lifecyclePolicies/{policy}"
              Сокращенные форматы:
                - "projects/{project}/registries/{registry}/lifecyclePolicies/{policy}"
                - "registries/{registry}/lifecyclePolicies/{policy}"
                - "lifecyclePolicies/{policy}"
                - "{policy}"
          
            Полный формат всегда корректен.
            Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
          
            Примеры:
              - "registry/projects/myProject/registries/myRegistry/lifecyclePolicies/myPolicy"
              - "projects/myProject/registries/myRegistry/lifecyclePolicies/myPolicy"
              - "registries/myRegistry/lifecyclePolicies/myPolicy"
              - "lifecyclePolicies/myPolicy"
              - "myPolicy"
          nullable: true
        ipFilter:
          allOf:
            - $ref: '#/components/schemas/RegistryIpFilterRuleResponse'
          description: Правило фильтрации операций над артефактами на основе IP адреса клиента. Правило работает дополнительно к проверкам доступа на основе ролевой модели
          nullable: true

    RegistryIpFilterRuleResponse:
      type: object
      description: Правило фильтрации операций над артефактами на основе IP адреса клиента. Правило работает дополнительно к проверкам доступа на основе ролевой модели
      properties:
        mode:
          $ref: '#/components/schemas/RegistryIPFilterMode'
          description: Переключает поведение между WHITELIST или BLACKLIST. WHITELIST - доступ будет разрешен только для описанных правил. BLACKLIST - доступ будет запрещен только для описанных правил
        sourceIpCidrRanges:
          type: array
          description: Массив подсетей для которых будет проверено правило
          items:
            type: string
            description: |-
              IPv4 или IPv6 подсеть в CIDR нотации
            
              Примеры:
                - "192.168.1.0/24"
                - "2001:db8::/64"
        operations:
          type: array
          description: Список операций ограничивающих применение правила
          items:
            $ref: '#/components/schemas/RegistryIPFilterOperation'
      required:
        - mode
        - sourceIpCidrRanges

    RegistryIPFilterMode:
      type: string
      description: Переключает поведение между WHITELIST или BLACKLIST. WHITELIST - доступ будет разрешен только для описанных правил. BLACKLIST - доступ будет запрещен только для описанных правил
      enum:
        - "BLACKLIST"
        - "WHITELIST"

    RegistryIPFilterOperation:
      type: string
      description: Тип операции над артефактом в реестре
      enum:
        - "PUSH"
        - "PULL"
        - "DELETE"

    RegistryStatusResponse:
      description: Статус реестра
      $ref: '#/components/schemas/ResourceStatusResponse'

    ResourceStatusResponse:
      type: object
      properties:
        ready:
          $ref: '#/components/schemas/ResourceStatusReadyResponse'
          description: Информация о статусе реконсиляции
      required:
        - ready

    ResourceStatusReadyResponse:
      type: object

            Обязательно для заполнения при создании ресурса
          items:
            $ref: '#/components/schemas/LifecyclePolicyRuleRequest'

    LifecyclePolicyRuleRequest:
      type: object
      description: Правило описывающее условия для поиска образов для удаления
      properties:
        retain:
          type: object
          properties:
            count:
              type: integer
              description: Количество тэгов, которые нужно оставить, если тэгов меньше чем это количество, то проверка на дату не повлияет на удаление, даже если она проходит. Должно быть задано retain или expireDuration
              format: uint32
              nullable: true
            duration:
              type: string
              description: |-
                Период определяющий максимальное время жизни образа в репозитории относительно текущего момента времени. Должно быть задано retain или expireDuration
              
                Поддерживаются следующие форматы:
                  - ISO 8601: P(n)DT(n)H(n)M(n)S. Допустимые единицы измерения: дни (`D`), часы (`H`), минуты (`M`), секунды (`S`). Только секунды могут быть дробными
                  - Простой формат. Допустимые единицы измерения: `d`, `h`, `m`, `s`, `ms`, `us`, `ns`.
                    Величины должны следовать по убыванию единиц измерения
                  - Число в секундах
              
                Отрицательные значения обозначаются префиксом "-", в простом формате могут быть ограничены скобками.
                Регистр и пробелы игнорируются
              
                Примеры:
                  - "PT1S"
                  - "-PT4.2S"
                  - "P1DT2H3M4S"
                  - "42s"
                  - "1h10m42s"
                  - "-(1d 2h 3m 4s 5ms 6us 7ns)"
                  - "42"
              nullable: true
          nullable: true
        filter:
          type: object
          properties:
            tags:
              type: array
              description: |-
                Фильтр по которому будет произведен поиск образов подлежащих удалению. Значение может быть задано с использованием символа *, что будет значить любое количество любых символов. Должен быть задан tagFilter или untagged установлен в true
              
                Простая коллекция. При обновлении ресурса простая коллекция, переданная в запросе, полностью заменяет существующую. Подробнее см. в описании метода `Upsert`
              items:
                type: string
              nullable: true
            untagged:
              type: boolean
              description: Если установлен в true, будут найдены только образы на которые не ссылается ни один тэг. Должен быть задан tagFilter или untagged установлен в true

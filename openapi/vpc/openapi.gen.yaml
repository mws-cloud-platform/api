components:
  schemas:
    ListNetworksResponseResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NetworkResponse'
        nextPageToken:
          $ref: '#/components/schemas/NextPageToken'
          description: Строка, которую нужно передать в следующем запросе, чтобы получить следующую страницу. Для последней страницы не задан
      required:
        - items

    NetworkResponse:
      type: object
      description: Сеть — это виртуальный аналог физической сети на базе инфраструктуры MWS
      properties:
        kind:
          type: string
          default: vpc/v1/network
        metadata:
          allOf:
            - $ref: '#/components/schemas/CommonTypedResourceMetadataResponse'
          description: Набор общих для всех пользовательских объектов атрибутов. Может быть расширен атрибутами, специфичными для контейнеров
          nullable: true
        spec:
          $ref: '#/components/schemas/VpcNetworkSpecResponse'
        status:
          allOf:
            - $ref: '#/components/schemas/NetworkStatusResponse'
          nullable: true
      required:
        - spec

    CommonTypedResourceMetadataResponse:
      type: object
      description: Набор общих для всех пользовательских объектов атрибутов. Может быть расширен атрибутами, специфичными для контейнеров
      properties:
        id:
          type: string
          description: |-
            ID свойства
          
            Строка в формате: "servicename/foos/{foo}/bars/{bar}"
          
            Пример: "servicename/foos/myFoo/bars/myBar"
        displayName:
          type: string
          description: Отображаемое имя свойства
        createTime:
          type: string
          description: Дата создания объекта
          format: date-time
        updateTime:
          type: string
          description: Дата последнего изменения объекта
          format: date-time
        deleteTime:
          type: string
          description: Время запроса на удаление ресурса
          format: date-time
        purgeTime:
          type: string
          description: Время удаления ресурса
          format: date-time
        usages:
          type: array
          description: Связи с другими ресурсами. В зависимости от типа связи операции над ресурсом могут быть ограничены
          items:
            $ref: '#/components/schemas/UsageResponse'
        etag:
          type: string
          description: Идентификатор состояния ресурса, позволяет отслеживать изменение ресурса
        description:
          type: string
          description: Описание ресурса

    UsageResponse:
      type: object
      description: Связь ресурса с другим ресурсом. В зависимости от типа связи операции над ресурсом могут быть ограничены
      properties:
        usageType:
          type: string
          description: Тип связи. Помимо стандартных `own` и `use` могут быть добавлены специализированные типы для конкретных сервисов
        name:
          type: string
          description: Имя связи. Требуется для модификации коллекции
        resource:
          type: string
          description: Ссылка на ресурс
      required:
        - usageType
        - name
        - resource

    VpcNetworkSpecResponse:
      type: object
      properties:
        mtu:
          type: integer
          description: |-
            Неизменяемое поле. Задается только при создании ресурса.
            При обновлении ресурса можно передать только текущее значение
          format: int32
          default: 1500
        internetAccess:
          type: boolean
          default: true

    NetworkStatusResponse:
      type: object
      allOf:
        - $ref: '#/components/schemas/ResourceStatusResponse'
        - type: object
          properties:
            mtu:
              type: integer
              description: Максимальная единица передачи в байтах (maximum transmission unit - MTU)
              format: int32
              example: 1500
            internetAccess:
              type: boolean
              description: Доступ в интернет

    ResourceStatusResponse:
      type: object
      description: Текущее состояние ресурса, вычисляемое системой
      properties:
        ready:
          $ref: '#/components/schemas/ResourceStatusReadyResponse'
          description: Информация о статусе реконсиляции
      required:
        - ready

    ResourceStatusReadyResponse:
      type: object
      description: Информация о статусе реконсиляции
      properties:
        state:
          $ref: '#/components/schemas/ResourceStatusState'
          description: Состояние ресурса
        message:
          type: string
          description: Описание статуса
          example: Success operation
      required:
        - state

    ResourceStatusState:
      type: string
      description: Состояние ресурса
      enum:
        - "OK"
        - "FAILED"
        - "PROCESSING"

    NextPageToken:
      type: string
      description: Строка, которую нужно передать в следующем запросе, чтобы получить следующую страницу. Для последней страницы не задан

    NetworkRequest:
      type: object
      description: Сеть — это виртуальный аналог физической сети на базе инфраструктуры MWS
      properties:
        metadata:
          allOf:
            - $ref: '#/components/schemas/CommonTypedResourceMetadataRequest'
          description: Набор общих для всех пользовательских объектов атрибутов. Может быть расширен атрибутами, специфичными для контейнеров
          nullable: true
        spec:
          $ref: '#/components/schemas/VpcNetworkSpecRequest'
          description: Обязательно для заполнения при создании ресурса

    CommonTypedResourceMetadataRequest:
      type: object
      description: Набор общих для всех пользовательских объектов атрибутов. Может быть расширен атрибутами, специфичными для контейнеров
      properties:
        displayName:
          type: string
          description: Отображаемое имя свойства
        etag:
          type: string
          description: Идентификатор состояния ресурса, позволяет отслеживать изменение ресурса
        description:
          type: string
          description: Описание ресурса

    VpcNetworkSpecRequest:
      type: object
      properties:
        mtu:
          type: integer
          description: |-
            Неизменяемое поле. Задается только при создании ресурса.
            При обновлении ресурса можно передать только текущее значение
          format: int32
          default: 1500
        internetAccess:
          type: boolean
          default: true

    ListNatGatewayResponseResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NatGatewayResponse'
        nextPageToken:
          $ref: '#/components/schemas/NextPageToken'
          description: Строка, которую нужно передать в следующем запросе, чтобы получить следующую страницу. Для последней страницы не задан
      required:
        - items

    NatGatewayResponse:
      type: object
      description: Описывает Nat шлюз
      properties:
        kind:
          type: string
          default: vpc/v1/natGateway
        metadata:
          allOf:
            - $ref: '#/components/schemas/CommonTypedResourceMetadataResponse'
          description: Метаданные Nat шлюза
          nullable: true
        spec:
          type: object
          description: Спецификация Nat шлюза
        status:
          allOf:
            - $ref: '#/components/schemas/NatGatewayStatusResponse'
          description: Статус NAT шлюза
          nullable: true
      required:
        - spec

    NatGatewayStatusResponse:
      description: Статус NAT шлюза
      $ref: '#/components/schemas/ResourceStatusResponse'

    ListExternalAddressesResponseResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExternalAddressResponse'
        nextPageToken:
          $ref: '#/components/schemas/NextPageToken'
          description: Строка, которую нужно передать в следующем запросе, чтобы получить следующую страницу. Для последней страницы не задан
      required:
        - items

    ExternalAddressResponse:
      type: object
      description: Внешний адрес — IP-адрес, который используется для связи ресурсов с интернетом
      properties:
        kind:
          type: string
          default: vpc/v1/externalAddress
        metadata:
          allOf:
            - $ref: '#/components/schemas/CommonTypedResourceMetadataResponse'
          description: Метаданные внешнего адреса
          nullable: true
        spec:
          $ref: '#/components/schemas/VpcExternalAddressSpecResponse'
          description: Спецификация внешнего адреса
        status:
          allOf:
            - $ref: '#/components/schemas/ExternalAddressStatusResponse'
          description: Статус внешнего адреса
          nullable: true
      required:
        - spec

    VpcExternalAddressSpecResponse:
      type: object
      description: Спецификация внешнего адреса
      properties:
        region:
          type: string
          description: |-
            Регион, которому принадлежит адрес
          
            Строка в форматах:
              Полный формат:
                - "rm/regions/{region}"
              Сокращенные форматы:
                - "regions/{region}"
                - "{region}"
          
            Полный формат всегда корректен.
            Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
          
            Неизменяемое поле. Задается только при создании ресурса.
            При обновлении ресурса можно передать только текущее значение
          
            Примеры:
              - "rm/regions/myRegion"
              - "regions/myRegion"
              - "myRegion"
        natGateway:
          type: string
          description: |-
            Шлюз, к которому относится адрес. Если шлюз не указан, для трансляции IP-адресов используется шлюз по умолчанию для выхода в интернет (ref=natGateways/internet-gateway)
          
            Строка в форматах:
              Полный формат:
                - "vpc/projects/{project}/natGateways/{natGateway}"
              Сокращенные форматы:
                - "projects/{project}/natGateways/{natGateway}"
                - "natGateways/{natGateway}"
                - "{natGateway}"
          
            Полный формат всегда корректен.
            Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
          
            Неизменяемое поле. Задается только при создании ресурса.
            При обновлении ресурса можно передать только текущее значение
          
            Примеры:
              - "vpc/projects/myProject/natGateways/myNatGateway"
              - "projects/myProject/natGateways/myNatGateway"
              - "natGateways/myNatGateway"
              - "myNatGateway"

    ExternalAddressStatusResponse:
      type: object
      description: Статус внешнего адреса
      allOf:
        - $ref: '#/components/schemas/ResourceStatusResponse'
        - type: object
          properties:
            ipAddress:
              type: string
              description: |-
                Присвоенный адрес
              
                IPv4- или IPv6-адрес
              
                Примеры:
                  - "192.168.1.1"
                  - "2001:db8:130F::9C0:876A:130B"
              example: 201.1.1.1
            active:
              type: boolean
              description: 'Состояние внешнего адреса: активен или не активен'
            region:
              type: string
              description: |-
                Регион, которому принадлежит адрес
              
                Строка в формате: "rm/regions/{region}"
              
                Пример: "rm/regions/myRegion"

    ExternalAddressRequest:
      type: object
      description: Внешний адрес — IP-адрес, который используется для связи ресурсов с интернетом
      properties:

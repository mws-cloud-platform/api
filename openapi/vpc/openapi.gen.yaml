        - $ref: "#/components/parameters/query_createOnly"
        - $ref: "#/components/parameters/query_validateOnly"
      security:
        - BearerAuth: []
      requestBody:
        description: Данные для создания или изменения группы адресов
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VpcAddressGroupRequest'
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VpcAddressGroupResponse'
        default:

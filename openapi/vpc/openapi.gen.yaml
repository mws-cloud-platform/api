          nullable: true
        spec:
          $ref: '#/components/schemas/EgressNatSpecResponse'
          description: Описывает спецификацию Egress (Many-to-Many) NAT-шлюза
        status:
          allOf:
            - $ref: '#/components/schemas/EgressNatStatusResponse'
          description: Описывает статус Egress (Many-to-Many) NAT-шлюза
          nullable: true
      required:
        - spec


      type: object
      description: Описывает спецификацию Egress (Many-to-Many) NAT-шлюза
      properties:
        internal:
          $ref: '#/components/schemas/EgressNatSpecInternalResponse'
          description: Группирующий элемент для всего, что касается внутренних ресурсов
        external:
          $ref: '#/components/schemas/EgressNatSpecExternalResponse'
          description: Группирующий элемент для всего, что касается внешней части (ресурсов, доступных извне)
        portAllocation:
          allOf:
            - $ref: '#/components/schemas/EgressNatSpecPortAllocationResponse'
          description: Описывает настройки управления портами
          nullable: true
      required:
        - internal
        - external

    EgressNatSpecInternalResponse:
      type: object
      description: Группирующий элемент для всего, что касается внутренних ресурсов
      properties:
        subnets:
          type: array
          description: Коллекция относительных ссылок на подсети, для которых будет осуществляться трансляция
          items:
            type: string
            description: |-
              Ссылка на ресурс
            
              Строка в форматах:
                Полный формат:
                  - "vpc/projects/{project}/networks/{network}/subnets/{subnet}"
                Сокращенные форматы:
                  - "projects/{project}/networks/{network}/subnets/{subnet}"
                  - "networks/{network}/subnets/{subnet}"
                  - "subnets/{subnet}"
                  - "{subnet}"
            
              Полный формат всегда корректен.
              Допускается сокращенный формат: элементы, которые уже есть в пути запроса, в ссылке можно опустить
            
              Примеры:
                - "vpc/projects/myProject/networks/myNetwork/subnets/mySubnet"
                - "projects/myProject/networks/myNetwork/subnets/mySubnet"
                - "networks/myNetwork/subnets/mySubnet"
                - "subnets/mySubnet"
                - "mySubnet"
